<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子女父母健康看板 - 草本数智</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #65746D;
            --primary-light: #7C8B85;
            --primary-bg: rgba(101, 116, 109, 0.035);
            --primary-border: rgba(101, 116, 109, 0.06);
            --ai-blue: #9AA7A3;
            --ai-blue-bg: rgba(154, 167, 163, 0.035);
            --anti-warm: #9C958C;
            --anti-warm-bg: rgba(156, 149, 140, 0.03);
            --bg-start: #FBF8F3;
            --bg-end: #F8F5F0;
            --card-bg: #FFFFFF;
            --card-border: rgba(200, 196, 190, 0.28);
            --text-title: #323834;
            --text-body: #55615C;
            --text-sub: #7B857F;
            --text-tip: #9FA8A4;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --space-xs: 8px;
            --space-sm: 14px;
            --space-md: 20px;
            --space-lg: 28px;
            --space-xl: 36px;
            --shadow: 0 8px 28px rgba(40, 44, 42, 0.03);
            --shadow-hover: 0 14px 42px rgba(40, 44, 42, 0.045);
            --transition: all 320ms cubic-bezier(0.34, 0, 0.12, 1);
            --bg-ink-opacity: 0.32;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(170deg, var(--bg-start), var(--bg-end));
            background-attachment: fixed;
            color: var(--text-body);
            line-height: 1.7;
            overflow-x: hidden;
            padding-bottom: 100px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60px 180px at 4% 30%, rgba(85, 96, 90, 0.03) 0%, transparent 72%),
                radial-gradient(ellipse 40px 140px at 2% 60%, rgba(85, 96, 90, 0.02) 0%, transparent 72%),
                radial-gradient(ellipse 320px 120px at 18% 86%, rgba(80, 86, 86, 0.02) 0%, transparent 62%),
                radial-gradient(ellipse 260px 100px at 76% 92%, rgba(80, 86, 86, 0.018) 0%, transparent 62%),
                radial-gradient(ellipse at top, rgba(90, 98, 94, 0.008), transparent 60%);
            pointer-events: none;
            z-index: -1;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            right: 0;
            width: 260px;
            height: 100vh;
            background:
                radial-gradient(ellipse 36px 120px at 78% 18%, rgba(95, 108, 102, 0.03) 0%, transparent 74%),
                radial-gradient(ellipse 30px 96px at 86% 44%, rgba(95, 108, 102, 0.02) 0%, transparent 74%),
                radial-gradient(ellipse 24px 80px at 92% 68%, rgba(95, 108, 102, 0.018) 0%, transparent 74%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 28px;
            position: relative;
            z-index: 1;
        }

        #bg-ink-image {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 100vw;
            max-width: none;
            height: auto;
            max-height: 100vh;
            object-fit: cover;
            pointer-events: none;
            z-index: 0;
            opacity: var(--bg-ink-opacity);
            image-rendering: -webkit-optimize-contrast;
            -webkit-image-rendering: -webkit-optimize-contrast;
            filter: contrast(1.08) saturate(1.02) brightness(1.02);
            will-change: opacity, transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        @media (max-width: 768px) { #bg-ink-image { display: none; } }

        .nav-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: rgba(255, 253, 248, 0.85);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border-bottom: 1px solid var(--card-border);
            box-shadow: 0 2px 12px rgba(74, 82, 80, 0.03);
            transition: var(--transition);
        }

        .nav-wrapper.scrolled {
            background: rgba(255, 253, 248, 0.94);
            box-shadow: 0 4px 20px rgba(74, 82, 80, 0.05);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 84px;
            transition: var(--transition);
        }

        .nav-wrapper.scrolled .nav-container { height: 70px; }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary);
            font-weight: 700;
            font-size: 21px;
            text-decoration: none;
            transition: var(--transition);
        }

        .nav-logo:hover { opacity: 0.88; }
        .nav-logo svg { width: 38px; height: 38px; }

        .nav-menu {
            display: flex;
            gap: 6px;
            list-style: none;
        }

        .nav-menu li a {
            text-decoration: none;
            color: var(--text-body);
            font-weight: 500;
            font-size: 15px;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            position: relative;
            letter-spacing: 0.01em;
        }

        .nav-menu li a:hover {
            color: var(--primary);
            background: var(--primary-bg);
        }

        .nav-menu li a.active {
            color: var(--primary);
            background: var(--primary-bg);
        }

        .nav-menu li a.active::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 2.5px;
            background: var(--primary);
            border-radius: 2px;
        }

        .main-content {
            margin-top: 110px;
        }

        .page-header {
            text-align: center;
            margin-bottom: var(--space-xl);
            padding: var(--space-xl) 0;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-title);
            margin-bottom: 10px;
        }

        .page-subtitle {
            font-size: 16px;
            color: var(--text-sub);
        }

        .section {
            margin-bottom: var(--space-xl);
            padding: var(--space-xl);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .section::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 150px;
            height: 100%;
            background: radial-gradient(ellipse at right, rgba(139, 163, 154, 0.03) 0%, transparent 70%);
            pointer-events: none;
        }

        .section:hover { box-shadow: var(--shadow-hover); }

        .section-title {
            font-size: 23px;
            font-weight: 700;
            color: var(--text-title);
            margin-bottom: var(--space-lg);
            text-align: center;
            letter-spacing: 0.02em;
        }

        /* Family 页面特有样式 */
        .family-members {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-lg);
            margin-bottom: var(--space-lg);
        }

        .member-card {
            background: rgba(252, 250, 245, 0.8);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            text-align: center;
            transition: var(--transition);
            position: relative;
        }

        .member-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .member-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            margin: 0 auto var(--space-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #fff;
        }

        .member-name {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-title);
            margin-bottom: 6px;
        }

        .member-relation {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: var(--space-sm);
        }

        .member-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            background: linear-gradient(135deg, #7CB342, #689F38);
            color: #fff;
            font-size: 12px;
            border-radius: 999px;
        }

        .member-status.warning {
            background: linear-gradient(135deg, #FFB74D, #FFA726);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .view-detail-btn {
            margin-top: var(--space-md);
            padding: 10px 22px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .view-detail-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(101, 116, 109, 0.2);
        }

        .health-overview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-md);
            margin-bottom: var(--space-lg);
        }

        .overview-card {
            background: rgba(252, 250, 245, 0.8);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: var(--space-md);
            text-align: center;
            transition: var(--transition);
        }

        .overview-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .overview-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto var(--space-xs);
        }

        .overview-icon svg {
            width: 100%;
            height: 100%;
            stroke: var(--primary);
        }

        .overview-label {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .overview-value {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-title);
        }

        .alert-section {
            background: rgba(255, 248, 225, 0.6);
            border: 1px solid #FFE082;
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            margin-bottom: var(--space-lg);
        }

        .alert-title {
            font-size: 18px;
            font-weight: 600;
            color: #F57C00;
            margin-bottom: var(--space-sm);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-list {
            list-style: none;
        }

        .alert-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #FFE082;
        }

        .alert-item:last-child {
            border-bottom: none;
        }

        .alert-icon {
            width: 28px;
            height: 28px;
            background: #FF9800;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            flex-shrink: 0;
        }

        .alert-content {
            flex-grow: 1;
        }

        .alert-member {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-title);
        }

        .alert-message {
            font-size: 13px;
            color: var(--text-body);
        }

        .alert-time {
            font-size: 12px;
            color: var(--text-sub);
        }

        .care-reminder {
            background: rgba(252, 250, 245, 0.8);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
        }

        .reminder-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-title);
            margin-bottom: var(--space-md);
        }

        .reminder-list {
            list-style: none;
        }

        .reminder-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--card-border);
        }

        .reminder-item:last-child {
            border-bottom: none;
        }

        .reminder-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--primary);
            border-radius: 4px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .reminder-text {
            font-size: 15px;
            color: var(--text-body);
            flex-grow: 1;
        }

        .reminder-time {
            font-size: 13px;
            color: var(--text-sub);
        }

        .add-member-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: var(--space-md);
            background: transparent;
            border: 2px dashed var(--card-border);
            border-radius: var(--radius-lg);
            font-size: 16px;
            font-weight: 500;
            color: var(--primary);
            cursor: pointer;
            transition: var(--transition);
        }

        .add-member-btn:hover {
            background: var(--primary-bg);
            border-color: var(--primary);
        }

        .add-member-btn svg {
            stroke: var(--primary);
        }

        .footer {
            margin-top: 60px;
            padding: 40px 20px;
            text-align: center;
            color: var(--text-tip);
            font-size: 13px;
        }

        /* 弹窗样式 */
        .modal-overlay-custom {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content-custom {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: var(--space-xl);
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .modal-content-custom.large {
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-title);
            margin-bottom: var(--space-lg);
            text-align: center;
        }

        .form-group-custom {
            margin-bottom: var(--space-md);
        }

        .form-label-custom {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-title);
            margin-bottom: 6px;
        }

        .form-input-custom {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text-body);
            transition: var(--transition);
        }

        .form-input-custom:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-bg);
        }

        .form-actions-custom {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: var(--space-lg);
        }

        .btn-custom {
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-custom.primary {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            border: none;
            color: #fff;
        }

        .btn-custom.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(101, 116, 109, 0.2);
        }

        .btn-custom.secondary {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .btn-custom.secondary:hover {
            background: var(--primary-bg);
        }

        @media (max-width: 768px) {
            .nav-menu { display: none; }
            .family-members { grid-template-columns: 1fr; }
            .health-overview { grid-template-columns: repeat(2, 1fr); }
            .section { padding: var(--space-md); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 163, 154, 0.18); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(139, 163, 154, 0.28); }
    </style>
</head>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">子女父母健康看板</h1>
                <p class="page-subtitle">关爱家人健康，守护亲情温暖</p>
            </div>

            <!-- 家庭成员模块 -->
            <section class="section" id="familyMembersSection">
                <h2 class="section-title">家庭成员</h2>
                <div class="family-members" id="familyMembersContainer">
                    <div class="member-card loading">
                        <p style="color: var(--text-sub); text-align: center; width: 100%;">正在加载家庭成员...</p>
                    </div>
                </div>
            </section>

            <!-- 家庭健康总览模块 -->
            <section class="section" id="healthOverviewSection">
                <h2 class="section-title">家庭健康总览</h2>
                <div class="health-overview" id="healthOverviewContainer">
                    <div class="overview-card loading">
                        <p style="color: var(--text-sub); text-align: center;">正在加载...</p>
                    </div>
                </div>
            </section>

            <!-- 健康提醒模块 -->
            <section class="section" id="healthAlertsSection">
                <h2 class="section-title">健康提醒</h2>
                <div class="alert-section" id="alertSection">
                    <h3 class="alert-title">
                        <svg width="20" height="20" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M50 20 L80 80 L20 80 Z" stroke="#F57C00" stroke-width="4" fill="none"/>
                            <path d="M50 40 L50 60" stroke="#F57C00" stroke-width="4"/>
                            <circle cx="50" cy="70" r="3" fill="#F57C00"/>
                        </svg>
                        异常提醒
                    </h3>
                    <ul class="alert-list" id="alertList">
                        <li class="alert-item">
                            <p style="color: var(--text-sub); text-align: center; width: 100%;">正在加载提醒...</p>
                        </li>
                    </ul>
                </div>

                <div class="care-reminder" id="careReminderSection">
                    <h3 class="reminder-title">今日关怀任务</h3>
                    <ul class="reminder-list" id="reminderList">
                        <li class="reminder-item">
                            <p style="color: var(--text-sub); text-align: center; width: 100%;">正在加载任务...</p>
                        </li>
                    </ul>
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        © 2024 草本数智平台 版权所有
    </footer>

    <!-- 添加成员弹窗 -->
    <div id="addMemberModal" style="display: none;" class="modal-overlay-custom">
        <div class="modal-content-custom">
            <h3 class="modal-title">添加家庭成员</h3>
            <form id="addMemberForm">
                <div class="form-group-custom">
                    <label class="form-label-custom">成员姓名</label>
                    <input type="text" id="memberName" required class="form-input-custom">
                </div>
                <div class="form-group-custom">
                    <label class="form-label-custom">与您的关系</label>
                    <select id="memberRelation" required class="form-input-custom">
                        <option value="">请选择关系</option>
                        <option value="father">父亲</option>
                        <option value="mother">母亲</option>
                        <option value="grandfather">祖父</option>
                        <option value="grandmother">祖母</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                <div class="form-group-custom">
                    <label class="form-label-custom">手机号（用于关联账号）</label>
                    <input type="tel" id="memberPhone" required class="form-input-custom">
                </div>
                <div class="form-actions-custom">
                    <button type="button" onclick="FamilyModule.closeAddModal()" class="btn-custom secondary">取消</button>
                    <button type="submit" class="btn-custom primary">添加</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 成员详情弹窗 -->
    <div id="memberDetailModal" style="display: none;" class="modal-overlay-custom">
        <div class="modal-content-custom large">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-lg);">
                <h3 class="modal-title" style="margin: 0; text-align: left;" id="detailMemberName">成员详情</h3>
                <button onclick="FamilyModule.closeDetailModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-sub);">×</button>
            </div>
            <div id="memberDetailContent">
                <!-- 详情内容将通过JS动态加载 -->
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // 后端API配置
        // ============================================
        const API_BASE_URL = 'http://localhost:8080/api';

        // ============================================
        // 家庭成员管理模块
        // ============================================
        const FamilyModule = {
            async fetchFamilyMembers() {
                try {
                    const response = await fetch(`${API_BASE_URL}/family/members`, {
                        headers: {
                            'Authorization': `Bearer ${this.getToken()}`
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        this.renderFamilyMembers(data);
                    } else {
                        this.renderFamilyMembersFromLocal();
                    }
                } catch (error) {
                    console.error('获取家庭成员失败:', error);
                    this.renderFamilyMembersFromLocal();
                }
            },

            renderFamilyMembersFromLocal() {
                const members = JSON.parse(localStorage.getItem('familyMembers') || '[]');
                if (members.length === 0) {
                    const defaultMembers = [
                        { id: 1, name: '王大爷', relation: 'father', relationText: '父亲', avatar: '👴', status: 'healthy', statusText: '健康良好' },
                        { id: 2, name: '李奶奶', relation: 'mother', relationText: '母亲', avatar: '👵', status: 'warning', statusText: '需要关注' }
                    ];
                    this.renderFamilyMembers(defaultMembers);
                } else {
                    this.renderFamilyMembers(members);
                }
            },

            renderFamilyMembers(members) {
                const container = document.getElementById('familyMembersContainer');
                if (!container) return;

                const membersHtml = members.map(member => `
                    <div class="member-card" data-member-id="${member.id}">
                        <div class="member-avatar">${member.avatar || this.getDefaultAvatar(member.relation)}</div>
                        <h3 class="member-name">${member.name}</h3>
                        <p class="member-relation">${member.relationText || member.relation}</p>
                        <span class="member-status ${member.status === 'warning' ? 'warning' : ''}">
                            <span class="status-dot"></span>
                            ${member.statusText || '健康良好'}
                        </span>
                        <button class="view-detail-btn" onclick="FamilyModule.viewMemberDetail(${member.id})">查看详情</button>
                    </div>
                `).join('');

                const addButtonHtml = `
                    <div class="member-card">
                        <button class="add-member-btn" onclick="FamilyModule.showAddModal()">
                            <svg width="24" height="24" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M50 20 L50 80" stroke="currentColor" stroke-width="4"/>
                                <path d="M20 50 L80 50" stroke="currentColor" stroke-width="4"/>
                            </svg>
                            添加成员
                        </button>
                    </div>
                `;

                container.innerHTML = membersHtml + addButtonHtml;
            },

            getDefaultAvatar(relation) {
                const avatars = {
                    'father': '👴',
                    'mother': '👵',
                    'grandfather': '👴',
                    'grandmother': '👵',
                    'other': '👤'
                };
                return avatars[relation] || '👤';
            },

            showAddModal() {
                const modal = document.getElementById('addMemberModal');
                if (modal) {
                    modal.style.display = 'flex';
                }
            },

            closeAddModal() {
                const modal = document.getElementById('addMemberModal');
                if (modal) {
                    modal.style.display = 'none';
                    document.getElementById('addMemberForm')?.reset();
                }
            },

            async addMember(name, relation, phone) {
                const member = {
                    id: Date.now(),
                    name: name,
                    relation: relation,
                    relationText: this.getRelationText(relation),
                    phone: phone,
                    avatar: this.getDefaultAvatar(relation),
                    status: 'healthy',
                    statusText: '健康良好',
                    createdAt: new Date().toISOString()
                };

                const members = JSON.parse(localStorage.getItem('familyMembers') || '[]');
                members.push(member);
                localStorage.setItem('familyMembers', JSON.stringify(members));

                try {
                    const response = await fetch(`${API_BASE_URL}/family/members`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.getToken()}`
                        },
                        body: JSON.stringify(member)
                    });

                    if (response.ok) {
                        const result = await response.json();
                        member.id = result.id;
                        localStorage.setItem('familyMembers', JSON.stringify(members));
                    }
                } catch (error) {
                    console.log('同步到后端失败，已保存到本地');
                }

                this.closeAddModal();
                this.renderFamilyMembersFromLocal();
            },

            getRelationText(relation) {
                const texts = {
                    'father': '父亲',
                    'mother': '母亲',
                    'grandfather': '祖父',
                    'grandmother': '祖母',
                    'other': '其他'
                };
                return texts[relation] || relation;
            },

            async viewMemberDetail(memberId) {
                try {
                    const response = await fetch(`${API_BASE_URL}/family/members/${memberId}/detail`, {
                        headers: {
                            'Authorization': `Bearer ${this.getToken()}`
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        this.renderMemberDetail(data);
                    } else {
                        const members = JSON.parse(localStorage.getItem('familyMembers') || '[]');
                        const member = members.find(m => m.id === memberId);
                        if (member) {
                            const healthData = JSON.parse(localStorage.getItem(`healthData_${memberId}`) || '{}');
                            this.renderMemberDetail({ ...member, ...healthData });
                        }
                    }
                } catch (error) {
                    console.error('获取成员详情失败:', error);
                    this.renderMemberDetail({
                        name: '家庭成员',
                        constitutionType: '平和质',
                        healthData: {
                            bloodPressure: { value: '120/80', unit: 'mmHg' },
                            bloodSugar: { value: 5.6, unit: 'mmol/L' },
                            heartRate: { value: 72, unit: '次/分' },
                            weight: { value: 65.5, unit: 'kg' }
                        }
                    });
                }
            },

            renderMemberDetail(data) {
                const modal = document.getElementById('memberDetailModal');
                const content = document.getElementById('memberDetailContent');
                const nameEl = document.getElementById('detailMemberName');

                if (nameEl) nameEl.textContent = `${data.name || '家庭成员'} - 健康详情`;

                if (content) {
                    content.innerHTML = `
                        <div style="margin-bottom: var(--space-lg);">
                            <h4 style="font-size: 16px; color: var(--text-title); margin-bottom: var(--space-sm);">体质类型</h4>
                            <p style="font-size: 15px; color: var(--text-body); padding: var(--space-sm); background: var(--primary-bg); border-radius: var(--radius-sm);">
                                ${data.constitutionType || '未进行体质辨识'}
                            </p>
                        </div>
                        <div style="margin-bottom: var(--space-lg);">
                            <h4 style="font-size: 16px; color: var(--text-title); margin-bottom: var(--space-sm);">最新健康数据</h4>
                            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-sm);">
                                <div style="padding: var(--space-sm); background: rgba(252, 250, 245, 0.8); border-radius: var(--radius-sm); border: 1px solid var(--card-border);">
                                    <p style="color: var(--text-sub); font-size: 13px;">血压</p>
                                    <p style="color: var(--text-title); font-size: 18px; font-weight: 600;">${data.healthData?.bloodPressure?.value || '--'} ${data.healthData?.bloodPressure?.unit || ''}</p>
                                </div>
                                <div style="padding: var(--space-sm); background: rgba(252, 250, 245, 0.8); border-radius: var(--radius-sm); border: 1px solid var(--card-border);">
                                    <p style="color: var(--text-sub); font-size: 13px;">血糖</p>
                                    <p style="color: var(--text-title); font-size: 18px; font-weight: 600;">${data.healthData?.bloodSugar?.value || '--'} ${data.healthData?.bloodSugar?.unit || ''}</p>
                                </div>
                                <div style="padding: var(--space-sm); background: rgba(252, 250, 245, 0.8); border-radius: var(--radius-sm); border: 1px solid var(--card-border);">
                                    <p style="color: var(--text-sub); font-size: 13px;">心率</p>
                                    <p style="color: var(--text-title); font-size: 18px; font-weight: 600;">${data.healthData?.heartRate?.value || '--'} ${data.healthData?.heartRate?.unit || ''}</p>
                                </div>
                                <div style="padding: var(--space-sm); background: rgba(252, 250, 245, 0.8); border-radius: var(--radius-sm); border: 1px solid var(--card-border);">
                                    <p style="color: var(--text-sub); font-size: 13px;">体重</p>
                                    <p style="color: var(--text-title); font-size: 18px; font-weight: 600;">${data.healthData?.weight?.value || '--'} ${data.healthData?.weight?.unit || ''}</p>
                                </div>
                            </div>
                        </div>
                        <div style="margin-bottom: var(--space-lg);">
                            <h4 style="font-size: 16px; color: var(--text-title); margin-bottom: var(--space-sm);">AI健康建议</h4>
                            <div style="padding: var(--space-sm); background: var(--primary-bg); border-radius: var(--radius-sm);">
                                <p style="color: var(--text-body); line-height: 1.8;">${data.aiAdvice || '暂无AI健康建议，建议完成体质辨识获取个性化建议。'}</p>
                            </div>
                        </div>
                        <div>
                            <button onclick="FamilyModule.goToMemberHealth(${data.id})" style="width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary-light), var(--primary)); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 15px; cursor: pointer;">
                                查看完整健康档案
                            </button>
                        </div>
                    `;
                }

                if (modal) {
                    modal.style.display = 'flex';
                }
            },

            closeDetailModal() {
                const modal = document.getElementById('memberDetailModal');
                if (modal) {
                    modal.style.display = 'none';
                }
            },

            goToMemberHealth(memberId) {
                localStorage.setItem('currentMemberId', memberId);
                window.location.href = `health.html?memberId=${memberId}`;
            },

            getToken() {
                return localStorage.getItem('token') || '';
            }
        };

        // ============================================
        // 家庭健康总览模块
        // ============================================
        const FamilyHealthOverviewModule = {
            async fetchHealthOverview() {
                try {
                    const response = await fetch(`${API_BASE_URL}/family/health-overview`, {
                        headers: {
                            'Authorization': `Bearer ${this.getToken()}`
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        this.renderHealthOverview(data);
                    } else {
                        this.calculateLocalOverview();
                    }
                } catch (error) {
                    console.error('获取家庭健康总览失败:', error);
                    this.calculateLocalOverview();
                }
            },

            calculateLocalOverview() {
                const members = JSON.parse(localStorage.getItem('familyMembers') || '[]');
                
                let totalBP = { systolic: 0, diastolic: 0, count: 0 };
                let totalSugar = 0, sugarCount = 0;
                let totalHeartRate = 0, heartRateCount = 0;
                let totalWeight = 0, weightCount = 0;

                members.forEach(member => {
                    const healthData = JSON.parse(localStorage.getItem(`healthData_${member.id}`) || '{}');
                    
                    if (healthData.bloodPressure) {
                        const [sys, dia] = healthData.bloodPressure.value.split('/').map(Number);
                        totalBP.systolic += sys;
                        totalBP.diastolic += dia;
                        totalBP.count++;
                    }
                    if (healthData.bloodSugar) {
                        totalSugar += Number(healthData.bloodSugar.value);
                        sugarCount++;
                    }
                    if (healthData.heartRate) {
                        totalHeartRate += Number(healthData.heartRate.value);
                        heartRateCount++;
                    }
                    if (healthData.weight) {
                        totalWeight += Number(healthData.weight.value);
                        weightCount++;
                    }
                });

                const overview = {
                    avgBloodPressure: totalBP.count > 0 ? 
                        `${Math.round(totalBP.systolic / totalBP.count)}/${Math.round(totalBP.diastolic / totalBP.count)}` : '125/82',
                    avgBloodSugar: sugarCount > 0 ? (totalSugar / sugarCount).toFixed(1) : '5.8',
                    avgHeartRate: heartRateCount > 0 ? Math.round(totalHeartRate / heartRateCount) : 74,
                    avgWeight: weightCount > 0 ? (totalWeight / weightCount).toFixed(1) : '68.5'
                };

                this.renderHealthOverview(overview);
            },

            renderHealthOverview(data) {
                const container = document.getElementById('healthOverviewContainer');
                if (!container) return;

                container.innerHTML = `
                    <div class="overview-card">
                        <svg class="overview-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="50" cy="50" r="35" stroke="currentColor" stroke-width="2" fill="none"/>
                            <path d="M50 30 L50 50 L65 60" stroke="currentColor" stroke-width="2" fill="none"/>
                        </svg>
                        <p class="overview-label">平均血压</p>
                        <p class="overview-value">${data.avgBloodPressure || '--'}</p>
                    </div>
                    <div class="overview-card">
                        <svg class="overview-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M30 50 Q50 30 70 50 Q50 70 30 50" stroke="currentColor" stroke-width="2" fill="none"/>
                            <circle cx="50" cy="50" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
                        </svg>
                        <p class="overview-label">平均血糖</p>
                        <p class="overview-value">${data.avgBloodSugar || '--'}</p>
                    </div>
                    <div class="overview-card">
                        <svg class="overview-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M50 80 C50 80 20 55 20 35 C20 25 30 15 40 15 C45 15 50 20 50 25 C50 20 55 15 60 15 C70 15 80 25 80 35 C80 55 50 80 50 80" stroke="currentColor" stroke-width="2" fill="none"/>
                        </svg>
                        <p class="overview-label">平均心率</p>
                        <p class="overview-value">${data.avgHeartRate || '--'}</p>
                    </div>
                    <div class="overview-card">
                        <svg class="overview-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M30 70 Q50 20 70 70" stroke="currentColor" stroke-width="2" fill="none"/>
                            <path d="M35 60 L35 40" stroke="currentColor" stroke-width="2"/>
                            <path d="M65 60 L65 40" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <p class="overview-label">平均体重</p>
                        <p class="overview-value">${data.avgWeight || '--'}</p>
                    </div>
                `;
            },

            getToken() {
                return localStorage.getItem('token') || '';
            }
        };

        // ============================================
        // 健康提醒模块
        // ============================================
        const HealthAlertsModule = {
            async fetchHealthAlerts() {
                try {
                    const response = await fetch(`${API_BASE_URL}/family/alerts`, {
                        headers: {
                            'Authorization': `Bearer ${this.getToken()}`
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        this.renderAlerts(data.alerts || []);
                        this.renderReminders(data.reminders || []);
                    } else {
                        this.renderDefaultAlerts();
                    }
                } catch (error) {
                    console.error('获取健康提醒失败:', error);
                    this.renderDefaultAlerts();
                }
            },

            renderAlerts(alerts) {
                const container = document.getElementById('alertList');
                if (!container) return;

                if (alerts.length === 0) {
                    container.innerHTML = `
                        <li class="alert-item" style="justify-content: center;">
                            <p style="color: var(--text-sub);">暂无异常提醒，家人们都很健康！</p>
                        </li>
                    `;
                    return;
                }

                container.innerHTML = alerts.map(alert => `
                    <li class="alert-item" data-alert-id="${alert.id}">
                        <div class="alert-icon">${alert.icon || '⚠️'}</div>
                        <div class="alert-content">
                            <p class="alert-member">${alert.memberName} - ${alert.title}</p>
                            <p class="alert-message">${alert.message}</p>
                        </div>
                        <span class="alert-time">${alert.time}</span>
                    </li>
                `).join('');
            },

            renderReminders(reminders) {
                const container = document.getElementById('reminderList');
                if (!container) return;

                if (reminders.length === 0) {
                    container.innerHTML = `
                        <li class="reminder-item" style="justify-content: center;">
                            <p style="color: var(--text-sub);">暂无关怀任务</p>
                        </li>
                    `;
                    return;
                }

                container.innerHTML = reminders.map(reminder => `
                    <li class="reminder-item" data-reminder-id="${reminder.id}">
                        <input type="checkbox" class="reminder-checkbox" ${reminder.completed ? 'checked' : ''} 
                            onchange="HealthAlertsModule.toggleReminder(${reminder.id}, this.checked)">
                        <span class="reminder-text" style="${reminder.completed ? 'text-decoration: line-through; opacity: 0.6;' : ''}">${reminder.text}</span>
                        <span class="reminder-time">${reminder.time}</span>
                    </li>
                `).join('');
            },

            renderDefaultAlerts() {
                const defaultAlerts = [
                    { id: 1, icon: '⚠️', memberName: '李奶奶', title: '血压偏高', message: '今日血压测量值为 145/95 mmHg，高于正常范围', time: '2小时前' },
                    { id: 2, icon: '💊', memberName: '王大爷', title: '用药提醒', message: '降压药服用时间即将到来', time: '30分钟前' }
                ];

                const defaultReminders = [
                    { id: 1, text: '给父亲打电话询问身体状况', time: '09:00', completed: false },
                    { id: 2, text: '提醒母亲按时服用降压药', time: '12:00', completed: false },
                    { id: 3, text: '查看父母今日健康数据', time: '18:00', completed: false },
                    { id: 4, text: '周末带父母去体检', time: '周六', completed: false }
                ];

                this.renderAlerts(defaultAlerts);
                this.renderReminders(defaultReminders);
            },

            async toggleReminder(reminderId, completed) {
                const reminders = JSON.parse(localStorage.getItem('careReminders') || '[]');
                const reminder = reminders.find(r => r.id === reminderId);
                if (reminder) {
                    reminder.completed = completed;
                    localStorage.setItem('careReminders', JSON.stringify(reminders));
                }

                try {
                    await fetch(`${API_BASE_URL}/family/reminders/${reminderId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.getToken()}`
                        },
                        body: JSON.stringify({ completed })
                    });
                } catch (error) {
                    console.log('同步到后端失败');
                }

                this.fetchHealthAlerts();
            },

            getToken() {
                return localStorage.getItem('token') || '';
            }
        };

        // ============================================
        // 页面初始化
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            const navbar = document.getElementById('navbar');
            
            window.addEventListener('scroll', function() {
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });

            const addMemberForm = document.getElementById('addMemberForm');
            if (addMemberForm) {
                addMemberForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const name = document.getElementById('memberName').value;
                    const relation = document.getElementById('memberRelation').value;
                    const phone = document.getElementById('memberPhone').value;
                    FamilyModule.addMember(name, relation, phone);
                });
            }

            initFamilyPage();
            tryLoadBgImage();
        });

        async function initFamilyPage() {
            await Promise.all([
                FamilyModule.fetchFamilyMembers(),
                FamilyHealthOverviewModule.fetchHealthOverview(),
                HealthAlertsModule.fetchHealthAlerts()
            ]);
        }

        async function tryLoadBgImage() {
            const candidates = ['/image.png', '/static/image.png', '/images/image.png'];
            const imgEl = document.getElementById('bg-ink-image');
            if (!imgEl) return;

            if (imgEl.src && imgEl.src !== window.location.origin + '/') {
                return;
            }

            for (const path of candidates) {
                try {
                    const res = await fetch(path, { method: 'HEAD' });
                    if (res.ok) {
                        imgEl.src = path + '?v=' + Date.now();
                        return;
                    }
                } catch (e) { /* 忽略 */ }
            }
        }

        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                const imgEl = document.getElementById('bg-ink-image');
                if (imgEl && (!imgEl.src || imgEl.src === window.location.origin + '/')) {
                    tryLoadBgImage();
                }
            }
        });
    </script>
</body>
</html>
