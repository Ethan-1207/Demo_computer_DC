    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================

           统一色系｜统一圆角｜统一间距｜柔和光影｜高级呼吸感
           ============================================ */
        :root {
            /* 新中式极简 — 低饱和度、浅灰与淡墨绿为主（尽量保持低对比） */
            --primary: #65746D; /* 淡墨绿，低饱和 */
            --primary-light: #7C8B85;
            --primary-bg: rgba(101, 116, 109, 0.035);
            --primary-border: rgba(101, 116, 109, 0.06);

            /* 辅助色（极淡） */
            --ai-blue: #9AA7A3; /* 非鲜艳，偏青灰 */
            --ai-blue-bg: rgba(154, 167, 163, 0.035);
            --anti-warm: #9C958C; /* 很柔和的暖灰 */
            --anti-warm-bg: rgba(156, 149, 140, 0.03);

            /* 背景：米白色宣纸质感的极浅渐变 */
            --bg-start: #FBF8F3;
            --bg-end: #F8F5F0;

            /* 卡片：纯净柔白，边框更淡 */
            --card-bg: #FFFFFF;
            --card-border: rgba(200, 196, 190, 0.28);

            /* 文字层级（整体偏低对比，仍保证可读） */
            --text-title: #323834; /* 深灰偏墨 */
            --text-body: #55615C; /* 中性墨绿/灰 */
            --text-sub: #7B857F;
            --text-tip: #9FA8A4;

            /* 全局统一圆角 */
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;

            /* 全局统一间距 */
            --space-xs: 8px;
            --space-sm: 14px;
            --space-md: 20px;
            --space-lg: 28px;
            --space-xl: 36px;

            /* 阴影：尽量淡，保持通透 */
            --shadow: 0 8px 28px rgba(40, 44, 42, 0.03);
            --shadow-hover: 0 14px 42px rgba(40, 44, 42, 0.045);

            /* 动画 */
            --transition: all 320ms cubic-bezier(0.34, 0, 0.12, 1);
            /* 背景墨色图片不透明度（可调，适度提高以增强清晰度） */
            --bg-ink-opacity: 0.32;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(170deg, var(--bg-start), var(--bg-end));
            background-attachment: fixed;
            color: var(--text-body);
            line-height: 1.7;
            overflow-x: hidden;
            padding-bottom: 100px;
            position: relative;
        }

        /* 宣纸肌理质感 + 朦胧远山与竹影（使用单张图片控制可见度，低对比） */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            /* 保留柔和的云雾与宣纸纹理，具体的竹影与远山由页面背景图片控制（低不透明度的 <img>） */
            background:
                radial-gradient(ellipse 60px 180px at 4% 30%, rgba(85, 96, 90, 0.03) 0%, transparent 72%),
                radial-gradient(ellipse 40px 140px at 2% 60%, rgba(85, 96, 90, 0.02) 0%, transparent 72%),
                radial-gradient(ellipse 320px 120px at 18% 86%, rgba(80, 86, 86, 0.02) 0%, transparent 62%),
                radial-gradient(ellipse 260px 100px at 76% 92%, rgba(80, 86, 86, 0.018) 0%, transparent 62%),
                radial-gradient(ellipse at top, rgba(90, 98, 94, 0.008), transparent 60%);
            pointer-events: none;
            /* 将纸张纹理放到更后面，避免覆盖图片造成模糊感 */
            z-index: -1;
        }

        /* 右侧轻微晕染，真正的竹影与远山由单张图片控制（id="bg-ink-image"） */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            right: 0;
            width: 260px;
            height: 100vh;
            background:
                radial-gradient(ellipse 36px 120px at 78% 18%, rgba(95, 108, 102, 0.03) 0%, transparent 74%),
                radial-gradient(ellipse 30px 96px at 86% 44%, rgba(95, 108, 102, 0.02) 0%, transparent 74%),
                radial-gradient(ellipse 24px 80px at 92% 68%, rgba(95, 108, 102, 0.018) 0%, transparent 74%);
            pointer-events: none;
            z-index: 0;
        }

        /* 备用图片背景（使用单张 <img id="bg-ink-image"> 控制竹影与远山，样式在页面中以 inline style 设置） */

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 28px;
            position: relative;
            z-index: 1;
        }

        /* 控制单张背景图片的显示与透明度
           - 接近全屏但略小：width:95vw，使其比最开始的 cover 稍小一些
           - 提高 max-width 和 max-height，避免竖屏下过度裁剪 */
        #bg-ink-image {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 100vw;
            max-width: none;
            height: auto;
            max-height: 100vh;
            object-fit: cover;
            pointer-events: none;
            z-index: 0;
            opacity: var(--bg-ink-opacity);
            image-rendering: -webkit-optimize-contrast;
            -webkit-image-rendering: -webkit-optimize-contrast;
            filter: contrast(1.08) saturate(1.02) brightness(1.02);
            will-change: opacity, transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        @media (max-width: 768px) { #bg-ink-image { display: none; } }

        /* ============================================
           顶部导航栏 · 宣纸毛玻璃版
           ============================================ */
        .nav-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: rgba(255, 253, 248, 0.85);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border-bottom: 1px solid var(--card-border);
            box-shadow: 0 2px 12px rgba(74, 82, 80, 0.03);
            transition: var(--transition);
        }

        .nav-wrapper.scrolled {
            background: rgba(255, 253, 248, 0.94);
            box-shadow: 0 4px 20px rgba(74, 82, 80, 0.05);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 84px;
            transition: var(--transition);
        }

        .nav-wrapper.scrolled .nav-container { height: 70px; }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary);
            font-weight: 700;
            font-size: 21px;
            text-decoration: none;
            transition: var(--transition);
        }

        .nav-logo:hover { opacity: 0.88; }

        .nav-logo svg { width: 38px; height: 38px; }

        .nav-menu {
            display: flex;
            gap: 6px;
            list-style: none;
        }

        .nav-menu li a {
            text-decoration: none;
            color: var(--text-body);
            font-weight: 500;
            font-size: 15px;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            position: relative;
            letter-spacing: 0.01em;
        }

        .nav-menu li a:hover {
            color: var(--primary);
            background: var(--primary-bg);
        }

        .nav-menu li a.active {
            color: var(--primary);
            background: var(--primary-bg);
        }

        .nav-menu li a.active::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 2.5px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* ============================================
           主内容区
           ============================================ */
        .main-content {
            margin-top: 110px;
        }

        /* ============================================
           大区块卡片 · 宣纸质感+淡墨边框
           ============================================ */
        .section {
            margin-bottom: var(--space-xl);
            padding: var(--space-xl);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .section::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 150px;
            height: 100%;
            background: radial-gradient(ellipse at right, rgba(139, 163, 154, 0.03) 0%, transparent 70%);
            pointer-events: none;
        }

        .section:hover { box-shadow: var(--shadow-hover); }

        .section-header {
            display: flex;
            align-items: center;
            gap: 22px;
            margin-bottom: var(--space-lg);
        }

        .section-icon {
            width: 62px;
            height: 62px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-bg);
            border: 1px solid var(--primary-border);
            transition: var(--transition);
        }

        .section-icon:hover { transform: translateY(-3px); }

        .section-icon svg { width: 50%; height: 50%; stroke: var(--primary); }

        .section-title {
            font-size: 23px;
            font-weight: 700;
            color: var(--text-title);
            letter-spacing: 0.02em;
        }

        .section-subtitle {
            font-size: 14px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* ============================================
           右上角实时时钟 · 淡雅卡片
           ============================================ */
        .realtime-clock {
            background: var(--primary-bg);
            border: 1px solid var(--primary-border);
            border-radius: var(--radius-md);
            padding: 14px 22px;
            text-align: center;
            min-width: 150px;
            margin-left: auto;
            transition: var(--transition);
        }

        .clock-time {
            font-size: 24px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 0.06em;
        }

        .clock-greeting {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 6px;
        }

        /* ============================================
           每日推送卡片 · 淡墨风格
           ============================================ */
        .daily-push-cards {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .push-card {
            background: rgba(252, 250, 245, 0.8);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: var(--space-md);
            transition: var(--transition);
            position: relative;
        }

        /* 左侧淡墨细条 */
        .push-card::before {
            content: '';
            position: absolute;
            top: 16px;
            left: 0;
            width: 4px;
            height: calc(100% - 32px);
            border-radius: 0 4px 4px 0;
            transition: var(--transition);
        }

        .push-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(180, 175, 165, 0.35);
        }

        /* 三个标签对应三色，统一淡雅渐变 */
        .push-card.solar-term::before { background: linear-gradient(180deg, var(--primary-light), var(--primary)); }
        .push-card.ai-course::before { background: linear-gradient(180deg, #A8C5D4, var(--ai-blue)); }
        .push-card.anti-fraud::before { background: linear-gradient(180deg, #C8B9AA, var(--anti-warm)); }

        /* 标签：完美圆角胶囊，淡雅高级 */
        .push-card-tag {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 14px;
        }

        .push-card.solar-term .push-card-tag { background: linear-gradient(135deg, var(--primary-light), var(--primary)); }
        .push-card.ai-course .push-card-tag { background: linear-gradient(135deg, #A8C5D4, var(--ai-blue)); }
        .push-card.anti-fraud .push-card-tag { background: linear-gradient(135deg, #C8B9AA, var(--anti-warm)); }

        .push-card-title {
            font-size: 17.5px;
            font-weight: 600;
            color: var(--text-title);
            margin-bottom: 10px;
        }

        .push-card-content {
            font-size: 15px;
            color: var(--text-body);
            line-height: 1.75;
        }

        .push-card-time {
            font-size: 12px;
            color: var(--text-tip);
            margin-top: 16px;
        }

        /* 播放按钮淡雅版 */
        .play-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(139, 163, 154, 0.12);
        }

        .play-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(139, 163, 154, 0.18);
        }

        /* ============================================
           AI工具按钮
           ============================================ */
        .tools-container {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-top: var(--space-sm);
        }

        .tool-button {
            flex: 1;
            max-width: 280px;
            height: 72px;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tool-button.primary {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: white;
            box-shadow: 0 6px 18px rgba(139, 163, 154, 0.15);
        }

        .tool-button.secondary {
            background: white;
            color: var(--primary);
            border: 1px solid var(--primary-border);
        }

        .tool-button:hover { transform: translateY(-4px); }

        /* ============================================
           知识库卡片
           ============================================ */
        .knowledge-grid {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: var(--space-md);
        }

        .knowledge-card {
            background: rgba(255, 253, 248, 0.85);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: var(--space-md);
            transition: var(--transition);
        }

        .knowledge-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .knowledge-card-title {
            font-size: 17.5px;
            font-weight: 600;
            color: var(--text-title);
            margin-bottom: 12px;
        }

        .knowledge-card-desc {
            font-size: 14.5px;
            color: var(--text-body);
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .detail-button {
            padding: 10px 22px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }

        .detail-button:hover { transform: translateY(-2px); }

        /* ============================================
           页脚
           ============================================ */
        .footer {
            margin-top: 60px;
            padding: 40px 20px;
            text-align: center;
            color: var(--text-tip);
            font-size: 13px;
        }

        /* ============================================
           响应式完美适配
           ============================================ */
        @media (max-width:768px){
            .nav-menu { display: none; }
            .knowledge-grid { grid-template-columns: 1fr; }
            .tools-container { flex-direction: column; align-items: center; }
            .section-header { flex-direction: column; align-items: flex-start; }
            .realtime-clock { margin-left: 0; width: 100%; }
        }

        /* 美化滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 163, 154, 0.18); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(139, 163, 154, 0.28); }
    </style>
</head>

<script>
    // ============================================
    // 后端API配置（完全保留你原有JS，一丝不动）
    // ============================================
    const API_BASE_URL = 'http://localhost:8080/api';

    // ============================================
    // 实时时钟模块
    // ============================================
    const ClockModule = {
        timer: null,
        init() {
            this.updateClock();
            this.timer = setInterval(() => this.updateClock(), 1000);
        },
        updateClock() {
            const now = new Date();
            const timeEl = document.getElementById('clockTime');
            const greetingEl = document.getElementById('clockGreeting');
            if (timeEl) {
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                timeEl.textContent = `${hours}:${minutes}:${seconds}`;
            }
            if (greetingEl) {
                const hour = now.getHours();
                let greeting = '您好';
                if (hour >= 5 && hour < 12) greeting = '早上好，开启美好一天';
                else if (hour >= 12 && hour < 14) greeting = '中午好，记得午休';
                else if (hour >= 14 && hour < 18) greeting = '下午好，保持活力';
                else if (hour >= 18 && hour < 22) greeting = '晚上好，放松身心';
                else greeting = '夜深了，早点休息';
                greetingEl.textContent = greeting;
            }
        },
        destroy() {
            if (this.timer) { clearInterval(this.timer); this.timer = null; }
        }
    };

    // ============================================
    // 每日推送模块（完全保留原有逻辑）
    // ============================================
    const DailyPushModule = {
        async fetchDailyPush() {
            try {
                const token = localStorage.getItem('token') || '';
                const headers = {};
                if (token) headers['Authorization'] = `Bearer ${token}`;
                const response = await fetch(`${API_BASE_URL}/daily-push`, { headers });
                if (!response.ok) throw new Error('获取每日推送失败');
                const data = await response.json();
                this.renderDailyPush(data);
            } catch (error) {
                console.error('获取每日推送失败:', error);
                this.renderDefaultDailyPush();
            }
        },
        renderDailyPush(data) {
            const container = document.getElementById('dailyPushContainer');
            if (!container || !data) return;
            const pushItems = [
                { id: data.solarTerm.id, type: 'solar-term', title: '节气养生提醒', content: data.solarTerm.content, pushTime: new Date().toISOString() },
                { id: data.aiCourse.id, type: 'ai-course', title: 'AI每日养生课', content: data.aiCourse.content, audioUrl: data.aiCourse.audioUrl, aiGenerated: true, pushTime: new Date().toISOString() },
                { id: data.antiFraud.id, type: 'anti-fraud', title: '防骗小提示', content: data.antiFraud.content, pushTime: new Date().toISOString() }
            ];
            container.innerHTML = pushItems.map(item => this.createPushCard(item)).join('');
        },
        createPushCard(item) {
            const typeClass = item.type || 'default';
            const typeName = this.getTypeName(item.type);
            const hasAudio = item.audioUrl && item.audioUrl.trim() !== '';
            return `
                <div class="push-card ${typeClass}" data-id="${item.id || ''}" data-type="${item.type || ''}">
                    <span class="push-card-tag">${typeName}</span>
                    <h3 class="push-card-title">${item.title || '养生提醒'}</h3>
                    <p class="push-card-content">${item.content || ''}</p>
                    ${hasAudio ? `
                    <button class="play-button" onclick="DailyPushModule.playAudio('${item.audioUrl}', '${item.id}')">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        <span id="playBtn-${item.id}">一键播放</span>
                    </button>` : ''}
                    ${item.aiGenerated ? '<span style="color: #5988A2; font-size: 12px; margin-left: 8px;">🤖 AI生成</span>' : ''}
                    <p class="push-card-time">推送时间：${this.formatTime(item.pushTime || item.createTime)}</p>
                </div>`;
        },
        getTypeName(type) {
            const typeMap = { 'solar-term': '节气养生', 'ai-course': 'AI养生课', 'anti-fraud': '防骗提示', 'health-tip': '健康提醒', 'diet': '饮食建议', 'exercise': '运动指导', 'default': '养生推送' };
            return typeMap[type] || typeMap['default'];
        },
        renderDefaultDailyPush() {
            const defaultData = {
                solarTerm: { id: '1', content: '今日正值惊蛰时节，宜早睡早起，调养肝气。' },
                aiCourse: { id: '2', content: '今日主题：春季养肝护肝。', audioUrl: '' },
                antiFraud: { id: '3', content: '警惕包治百病类保健品骗局。' }
            };
            this.renderDailyPush(defaultData);
        },
        playAudio(audioUrl, itemId) {
            if (!audioUrl) { alert('音频内容即将上线，敬请期待！'); return; }
            const btnText = document.getElementById(`playBtn-${itemId}`);
            if (btnText) btnText.textContent = '播放中...';
            const audio = new Audio(audioUrl);
            audio.play().then(() => {
                audio.onended = () => { if (btnText) btnText.textContent = '一键播放'; };
            }).catch(err => {
                console.error('播放失败:', err);
                alert('音频播放失败，请稍后重试');
                if (btnText) btnText.textContent = '一键播放';
            });
        },
        formatTime(timeStr) {
            if (!timeStr) return '刚刚';
            const date = new Date(timeStr);
            return `${date.getMonth() + 1}月${date.getDate()}日 ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }
    };

    // ============================================
    // 中医养生知识库模块（完全保留原有逻辑）
    // ============================================
    const KnowledgeModule = {
        async fetchKnowledgeCategories() {
            try {
                const response = await fetch(`${API_BASE_URL}/knowledge/categories`);
                if (!response.ok) throw new Error('获取知识库分类失败');
                const data = await response.json();
                this.renderKnowledgeCategories(data);
            } catch (error) {
                console.error('获取知识库分类失败:', error);
                this.renderDefaultCategories();
            }
        },
        renderKnowledgeCategories(categories) {
            const container = document.getElementById('knowledgeGrid');
            if (!container || !categories || categories.length === 0) { this.renderDefaultCategories(); return; }
            container.innerHTML = categories.map(cat => `
                <div class="knowledge-card" data-category="${cat.code}">
                    <h3 class="knowledge-card-title">${cat.name}</h3>
                    <p class="knowledge-card-desc">${cat.description}</p>
                    <button class="detail-button" onclick="KnowledgeModule.viewCategoryDetail('${cat.code}')">查看详情</button>
                </div>`).join('');
        },
        renderDefaultCategories() {
            const defaultCategories = [
                { code: 'constitution', name: '体质养生', description: '了解9种中医体质特征，获取个性化的调理方案，包括饮食建议、运动指导和穴位按摩方法。' },
                { code: 'chronic', name: '慢病调理', description: '高血压、糖尿病、冠心病等老年常见病的中医养生方案，帮助您科学管理健康，提高生活质量。' },
                { code: 'solar', name: '节气养生', description: '二十四节气专属养生内容，顺应自然规律，掌握每个节气的饮食起居要点，健康度过四季。' },
                { code: 'anti-fraud', name: '防骗科普', description: '识别养生谣言，避开虚假保健品陷阱，学习科学养生知识，守护您的健康和财产安全。' }
            ];
            this.renderKnowledgeCategories(defaultCategories);
        },
        viewCategoryDetail(categoryCode) { alert(`分类【${categoryCode}】详情页面即将上线，敬请期待！`); },
        async fetchAIRecommendedArticles() { return Promise.resolve(); }
    };

    // ============================================
    // 页面初始化（完全保留原有逻辑）
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
        const navbar = document.getElementById('navbar');
        const currentDateElement = document.getElementById('currentDate');
        const now = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        if (currentDateElement) currentDateElement.textContent = now.toLocaleDateString('zh-CN', options);
        window.addEventListener('scroll', function() {
            if (window.scrollY > 50) navbar.classList.add('scrolled');
            else navbar.classList.remove('scrolled');
        });
        ClockModule.init();
        initPageData();
        // 尝试加载用户在 src 下放置的图片（有可能放在不同位置）
        tryLoadBgImage();

        // 监听页面可见性变化，当用户切回页面时重新检查背景图
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                const imgEl = document.getElementById('bg-ink-image');
                if (imgEl && (!imgEl.src || imgEl.src === window.location.origin + '/')) {
                    console.info('页面恢复可见，重新加载背景图片');
                    tryLoadBgImage();
                }
            }
        });
    });

    // 尝试从候选路径加载背景图片，使用第一个可用的
    async function tryLoadBgImage() {
        const candidates = [
            '/image.png',
            '/static/image.png',
            '/images/image.png',
            '/src/image.png',
            '/resources/image.png',
            '/static/img/image.png'
        ];
        const imgEl = document.getElementById('bg-ink-image');
        if (!imgEl) return;
        for (const path of candidates) {
            try {
                const res = await fetch(path, { method: 'HEAD' });
                if (res.ok) { imgEl.src = path + '?v=' + Date.now(); console.info('使用背景图片：', path); return; }
            } catch (e) { /* 忽略 */ }
        }
        console.info('未找到候选背景图片，保持默认纹理与低饱和 SVG（如有）');
    }

    // 开发者：添加一个小滑块可以在页面上即时调整背景画像不透明度（仅用于调试并保存在 localStorage）
    (function addBgOpacityControl(){
        try {
            const control = document.createElement('div');
            control.style.position = 'fixed';
            control.style.right = '12px';
            control.style.bottom = '12px';
            control.style.zIndex = 2000;
            control.style.background = 'rgba(255,255,255,0.6)';
            control.style.backdropFilter = 'blur(6px)';
            control.style.border = '1px solid rgba(0,0,0,0.06)';
            control.style.borderRadius = '8px';
            control.style.padding = '6px 10px';
            control.style.display = 'flex';
            control.style.alignItems = 'center';
            control.style.gap = '8px';
            control.style.fontSize = '12px';
            control.innerHTML = '<label style="font-size:12px;color:#55615C;">背景透明度</label><input id="bgOpacityRange" type="range" min="0" max="0.6" step="0.01" style="width:120px;" />';
            document.body.appendChild(control);
            const range = document.getElementById('bgOpacityRange');
            const stored = localStorage.getItem('bgInkOpacity');
            const initial = stored ? stored : getComputedStyle(document.documentElement).getPropertyValue('--bg-ink-opacity').trim();
            range.value = parseFloat(initial) || 0.12;
            range.addEventListener('input', (e) => {
                const v = e.target.value;
                document.documentElement.style.setProperty('--bg-ink-opacity', v);
                localStorage.setItem('bgInkOpacity', v);
            });
        } catch (e) { /* ignore */ }
    })();

    async function initPageData() {
        await Promise.all([ DailyPushModule.fetchDailyPush(), KnowledgeModule.fetchKnowledgeCategories() ]);
    }

    setInterval(() => { DailyPushModule.fetchDailyPush(); }, 5 * 60 * 1000);
    window.addEventListener('beforeunload', () => { ClockModule.destroy(); });
</script>
</body>
</html>
