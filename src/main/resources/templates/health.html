<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人健康管理 - 草本数智</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           完全复用 index 全局变量 & 风格体系
           ============================================ */
        :root {
            --primary: #65746D;
            --primary-light: #7C8B85;
            --primary-bg: rgba(101, 116, 109, 0.035);
            --primary-border: rgba(101, 116, 109, 0.06);
            --ai-blue: #9AA7A3;
            --ai-blue-bg: rgba(154, 167, 163, 0.035);
            --anti-warm: #9C958C;
            --anti-warm-bg: rgba(156, 149, 140, 0.03);
            --bg-start: #FBF8F3;
            --bg-end: #F8F5F0;
            --card-bg: #FFFFFF;
            --card-border: rgba(200, 196, 190, 0.28);
            --text-title: #323834;
            --text-body: #55615C;
            --text-sub: #7B857F;
            --text-tip: #9FA8A4;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --space-xs: 8px;
            --space-sm: 14px;
            --space-md: 20px;
            --space-lg: 28px;
            --space-xl: 36px;
            --shadow: 0 8px 28px rgba(40, 44, 42, 0.03);
            --shadow-hover: 0 14px 42px rgba(40, 44, 42, 0.045);
            --transition: all 320ms cubic-bezier(0.34, 0, 0.12, 1);
            --bg-ink-opacity: 0.32;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: linear-gradient(170deg, var(--bg-start), var(--bg-end));
            background-attachment: fixed;
            color: var(--text-body);
            line-height: 1.7;
            overflow-x: hidden;
            padding-bottom: 100px;
            position: relative;
        }

        /* index 同款宣纸墨晕背景 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60px 180px at 4% 30%, rgba(85, 96, 90, 0.03) 0%, transparent 72%),
                radial-gradient(ellipse 40px 140px at 2% 60%, rgba(85, 96, 90, 0.02) 0%, transparent 72%),
                radial-gradient(ellipse 320px 120px at 18% 86%, rgba(80, 86, 86, 0.02) 0%, transparent 62%),
                radial-gradient(ellipse 260px 100px at 76% 92%, rgba(80, 86, 86, 0.018) 0%, transparent 62%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 28px;
            position: relative;
            z-index: 1;
        }

        /* ============================================
           index 完全同款导航栏（毛玻璃+滚动收缩）
           ============================================ */
        .nav-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: rgba(255, 253, 248, 0.85);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border-bottom: 1px solid var(--card-border);
            box-shadow: 0 2px 12px rgba(74, 82, 80, 0.03);
            transition: var(--transition);
        }

        .nav-wrapper.scrolled {
            background: rgba(255, 253, 248, 0.94);
            box-shadow: 0 4px 20px rgba(74, 82, 80, 0.05);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 84px;
            transition: var(--transition);
        }

        .nav-wrapper.scrolled .nav-container { height: 70px; }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary);
            font-weight: 700;
            font-size: 21px;
            text-decoration: none;
            transition: var(--transition);
        }

        .nav-logo:hover { opacity: 0.88; }
        .nav-logo svg { width: 38px; height: 38px; }

        .nav-menu {
            display: flex;
            gap: 6px;
            list-style: none;
        }

        .nav-menu li a {
            text-decoration: none;
            color: var(--text-body);
            font-weight: 500;
            font-size: 15px;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            position: relative;
            letter-spacing: 0.01em;
        }

        .nav-menu li a:hover {
            color: var(--primary);
            background: var(--primary-bg);
        }

        .nav-menu li a.active {
            color: var(--primary);
            background: var(--primary-bg);
        }

        .nav-menu li a.active::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 2.5px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* ============================================
           主内容区（index 同款间距）
           ============================================ */
        .main-content {
            margin-top: 110px;
        }

        .page-header {
            text-align: center;
            margin-bottom: var(--space-xl);
            padding: var(--space-xl) 0;
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-title);
            margin-bottom: var(--space-sm);
        }

        .page-subtitle {
            font-size: 16px;
            color: var(--text-sub);
        }

        /* index 同款大区块卡片 */
        .section {
            margin-bottom: var(--space-xl);
            padding: var(--space-xl);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .section:hover { box-shadow: var(--shadow-hover); }

        .section-title {
            font-size: 23px;
            font-weight: 700;
            color: var(--text-title);
            margin-bottom: var(--space-lg);
        }

        /* 健康仪表盘 */
        .health-dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-md);
        }

        .health-card {
            background: rgba(252, 250, 245, 0.8);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: var(--space-md);
            text-align: center;
            transition: var(--transition);
        }

        .health-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .health-icon {
            width: 44px;
            height: 44px;
            margin: 0 auto 12px;
        }

        .health-label {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .health-value {
            font-size: 24px;
            font-weight: 600;
            color: var(--primary);
        }

        .health-unit {
            font-size: 14px;
            color: var(--text-sub);
        }

        .health-status {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 13px;
            margin-top: 8px;
            background: #E8F5E9;
            color: #2E7D32;
        }

        .health-status.warning {
            background: #FFF8E1;
            color: #FF8F00;
        }

        /* 图表容器 */
        .chart-container {
            background: rgba(252, 250, 245, 0.8);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            margin-bottom: var(--space-md);
        }

        .chart-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: var(--space-md);
            text-align: center;
        }

        .chart-placeholder {
            height: 250px;
            background: var(--primary-bg);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
        }

        /* 记录网格 */
        .records-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-md);
        }

        .record-card {
            background: rgba(252, 250, 245, 0.8);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: var(--space-md);
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-md);
        }

        .record-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
        }

        .add-btn {
            padding: 8px 18px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .record-list {
            list-style: none;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--card-border);
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .record-date {
            font-size: 14px;
            color: var(--text-sub);
        }

        .record-value {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-body);
        }

        /* 推荐卡片 */
        .recommendation-card {
            background: rgba(252, 250, 245, 0.8);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
        }

        .recommendation-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: var(--space-lg);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .recommendation-list {
            list-style: none;
        }

        .recommendation-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid var(--card-border);
        }

        .recommendation-item:last-child {
            border-bottom: none;
        }

        .recommendation-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            flex-shrink: 0;
        }

        .recommendation-content h4 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-title);
            margin-bottom: 4px;
        }

        .recommendation-content p {
            font-size: 15px;
            color: var(--text-body);
            line-height: 1.6;
        }

        /* 页脚 */
        .footer {
            margin-top: 60px;
            padding: 40px 20px;
            text-align: center;
            color: var(--text-tip);
            font-size: 13px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .nav-menu { display: none; }
            .health-dashboard { grid-template-columns: repeat(2, 1fr); }
            .records-grid { grid-template-columns: 1fr; }
            .section { padding: var(--space-md); }
        }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 163, 154, 0.18); border-radius: 3px; }
    </style>
</head>
<body>
<!-- index 同款背景图 -->
<img id="bg-ink-image" src="" alt="" style="position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100vw;opacity:var(--bg-ink-opacity);pointer-events:none;z-index:0;">

<nav class="nav-wrapper" id="navbar">
    <div class="nav-container">

            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">

<main class="main-content">
    <div class="page-header">
        <div class="container">

    <div class="container">
        <!-- 今日健康数据 -->
        <section class="section" id="todayHealthSection">
            <h2 class="section-title">今日健康数据</h2>

        <!-- AI健康建议 -->
        <section class="section" id="aiAdviceSection">
            <h2 class="section-title">AI 健康建议</h2>
            <div class="recommendation-card" id="aiRecommendationCard">
                <h3 class="recommendation-title">
                    <svg width="30" height="30" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="35" stroke="var(--primary)" stroke-width="2" fill="none"/>
                        <path d="M50 35 L50 50 L60 60" stroke="var(--primary)" stroke-width="2" fill="none"/>
                    </svg>
                    基于您的体质分析
                </h3>
                <div id="aiAdviceContent">
                    <p style="color: var(--text-sub); text-align: center; padding: 20px;">正在获取AI健康建议...</p>
                </div>
            </div>
        </section>

        <!-- 健康趋势分析 -->
        <section class="section" id="trendSection">
            <h2 class="section-title">健康趋势分析</h2>

                <h3 class="chart-title">血压变化趋势（近7天）</h3>
                <div class="chart-placeholder" id="bpChart">📊 正在加载血压趋势数据...</div>
            </div>
            <div class="chart-container" id="weightTrendContainer">
                <h3 class="chart-title">体重变化趋势（近30天）</h3>
                <div class="chart-placeholder" id="weightChart">📈 正在加载体重趋势数据...</div>
            </div>

        <!-- 健康记录 -->
        <section class="section" id="recordsSection">

                    <p style="color: var(--text-sub); text-align: center; padding: 20px;">正在加载健康记录...</p>

<script>
    // ============================================
    // 后端API配置（完全保留你原有全部JS逻辑）
    // ============================================
    const API_BASE_URL = 'http://localhost:8080/api';

    // ============================================
    // 今日健康数据模块
    // ============================================
    const TodayHealthModule = {
        async fetchTodayHealthData() {
            try {
                const token = this.getToken();
                if (!token) {
                    this.renderNoLogin();
                    return;
                }
                const response = await fetch(`${API_BASE_URL}/health/data`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const result = await response.json();
                    if (result.success && result.data) {
                        this.renderTodayHealthData(result.data);
                        return;
                    }
                }
            } catch (error) {
                console.log('从后端获取失败:', error);
            }
            this.renderNoData();
        },
        renderNoLogin() {
            const container = document.getElementById('todayHealthData');
            container.innerHTML = `
                <div class="health-card" style="grid-column: span 4;">
                    <p style="text-align: center;">请先<a href="profile.html" style="color: var(--primary);">登录</a>查看健康数据</p>
                </div>
            `;
        },
        renderNoData() {
            const container = document.getElementById('todayHealthData');
            container.innerHTML = `
                <div class="health-card" style="grid-column: span 4;">
                    <p style="text-align: center;">暂无健康数据，请先完成<a href="constitution.html" style="color: var(--primary);">AI体质辨识</a></p>
                </div>
            `;
        },
        mergeHealthData(constitutionData, manualData) {
            return {
                heartRate: manualData.heartRate || constitutionData.heartRate || { value: 72, unit: '次/分', status: 'normal' },
                bloodPressure: manualData.bloodPressure || constitutionData.bloodPressure || { value: '120/80', unit: 'mmHg', status: 'normal' },
                bloodSugar: manualData.bloodSugar || constitutionData.bloodSugar || { value: 5.6, unit: 'mmol/L', status: 'normal' },
                weight: manualData.weight || constitutionData.weight || { value: 65.5, unit: 'kg', status: 'warning' },
                constitutionType: constitutionData.constitutionType || null,
                lastUpdated: new Date().toISOString()
            };
        },
        renderTodayHealthData(data) {
            const container = document.getElementById('todayHealthData');
            const healthItems = [
                {
                    icon: `<path d="M50 80 C50 80 20 55 20 35 C20 25 30 15 40 15 C45 15 50 20 50 25 C50 20 55 15 60 15 C70 15 80 25 80 35 C80 55 50 80 50 80" stroke="var(--primary)" stroke-width="2" fill="none"/>`,
                    label: '心率',
                    value: data.heartRate?.value || '--',
                    unit: data.heartRate?.unit || '次/分',
                    status: data.heartRate?.status || 'normal',
                    statusText: this.getStatusText(data.heartRate?.status)
                },
                {
                    icon: `<circle cx="50" cy="50" r="30" stroke="var(--primary)" stroke-width="2" fill="none"/><path d="M50 30 L50 50 L65 60" stroke="var(--primary)" stroke-width="2" fill="none"/>`,
                    label: '血压',
                    value: data.bloodPressure?.value || '--',
                    unit: data.bloodPressure?.unit || 'mmHg',
                    status: data.bloodPressure?.status || 'normal',
                    statusText: this.getStatusText(data.bloodPressure?.status)
                },
                {
                    icon: `<path d="M30 50 Q50 30 70 50 Q50 70 30 50" stroke="var(--primary)" stroke-width="2" fill="none"/><circle cx="50" cy="50" r="10" stroke="var(--primary)" stroke-width="2" fill="none"/>`,
                    label: '血糖',
                    value: data.bloodSugar?.value || '--',
                    unit: data.bloodSugar?.unit || 'mmol/L',
                    status: data.bloodSugar?.status || 'normal',
                    statusText: this.getStatusText(data.bloodSugar?.status)
                },
                {
                    icon: `<path d="M30 70 Q50 20 70 70" stroke="var(--primary)" stroke-width="2" fill="none"/><path d="M35 60 L35 40" stroke="var(--primary)" stroke-width="2"/><path d="M65 60 L65 40" stroke="var(--primary)" stroke-width="2"/>`,
                    label: '体重',
                    value: data.weight?.value || '--',
                    unit: data.weight?.unit || 'kg',
                    status: data.weight?.status || 'normal',
                    statusText: this.getStatusText(data.weight?.status)
                }
            ];
            container.innerHTML = healthItems.map(item => `
                <div class="health-card" data-type="${item.label}">
                    <svg class="health-icon" viewBox="0 0 100 100" fill="none">
                        ${item.icon}
                    </svg>
                    <p class="health-label">${item.label}</p>
                    <p class="health-value">${item.value} <span class="health-unit">${item.unit}</span></p>
                    <span class="health-status ${item.status === 'warning' ? 'warning' : ''}">${item.statusText}</span>
                </div>
            `).join('');
        },
        getStatusText(status) {
            return { normal: '正常', warning: '注意', danger: '异常' }[status] || '正常';
        },
        getToken() { return localStorage.getItem('token') || ''; }
    };

    // ============================================
    // AI健康建议模块
    // ============================================
    const AIAdviceModule = {
        async fetchAIAdvice() {
            try {
                const token = this.getToken();
                if (!token) { this.renderNoLogin(); return; }
                const response = await fetch(`${API_BASE_URL}/health/ai-advice`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const result = await response.json();
                    if (result.success && result.data) {
                        this.renderAIAdvice(result.data);
                        return;
                    }
                }
            } catch (error) { console.error('获取AI建议失败:', error); }
            this.renderDefaultAdvice();
        },
        renderNoLogin() {
            document.getElementById('aiAdviceContent').innerHTML = `
                <p style="text-align: center; padding: 20px;">请先<a href="profile.html" style="color: var(--primary);">登录</a>查看AI健康建议</p>
            `;
        },
        renderAIAdvice(aiData) {
            const container = document.getElementById('aiAdviceContent');
            if (!aiData.hasConstitution) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 30px;">
                        <p style="margin-bottom: 20px;">${aiData.message}</p>
                        <p style="color: var(--primary); font-weight: 600;">${aiData.encouragement}</p>
                        <button onclick="window.location.href='constitution.html'" style="margin-top: 20px; padding: 12px 30px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius-sm);">开始体质辨识</button>
                    </div>
                `;
                return;
            }
            const adviceItems = [];
            aiData.healthAdvice && adviceItems.push({ icon: '💡', title: '健康建议', content: aiData.healthAdvice });
            aiData.dietaryRecommendations && adviceItems.push({ icon: '🍲', title: '饮食建议', content: aiData.dietaryRecommendations });
            aiData.exerciseRecommendations && adviceItems.push({ icon: '🏃', title: '运动建议', content: aiData.exerciseRecommendations });
            container.innerHTML = `
                <ul class="recommendation-list">
                    ${adviceItems.map(item => `
                        <li class="recommendation-item">
                            <div class="recommendation-icon">${item.icon}</div>
                            <div class="recommendation-content">
                                <h4>${item.title}</h4>
                                <p>${item.content}</p>
                            </div>
                        </li>
                    `).join('')}
                </ul>
                <p style="color: var(--primary); font-size: 14px; margin-top: 15px; text-align: center;">✨ 基于您的体质类型：${aiData.constitutionType}</p>
            `;
        },
        renderDefaultAdvice() {
            this.renderAIAdvice({
                hasConstitution: true,
                constitutionType: '平和质',
                healthAdvice: '保持良好作息，适度运动，心情舒畅。',
                dietaryRecommendations: '饮食均衡，多吃蔬菜水果，少油少盐。',
                exerciseRecommendations: '每天30分钟中等强度运动，如快走、太极拳。'
            });
        },
        getToken() { return localStorage.getItem('token') || ''; }
    };

    // ============================================
    // 健康趋势分析模块
    // ============================================
    const HealthTrendModule = {
        async fetchBPTrend() {
            try {
                const res = await fetch(`${API_BASE_URL}/health/trends/blood-pressure?days=7`, {
                    headers: { 'Authorization': `Bearer ${this.getToken()}` }
                });
                if (res.ok) { this.renderBPChart(await res.json()); } else { this.renderBPChartDefault(); }
            } catch { this.renderBPChartDefault(); }
        },
        async fetchWeightTrend() {
            try {
                const res = await fetch(`${API_BASE_URL}/health/trends/weight?days=30`, {
                    headers: { 'Authorization': `Bearer ${this.getToken()}` }
                });
                if (res.ok) { this.renderWeightChart(await res.json()); } else { this.renderWeightChartDefault(); }
            } catch { this.renderWeightChartDefault(); }
        },
        renderBPChart(data) {
            const el = document.getElementById('bpChart');
            if (!data || !data.length) { this.renderBPChartDefault(); return; }
            el.innerHTML = `
                <div style="padding:20px;">
                    <div style="margin-bottom:20px;color:var(--primary);font-weight:600;">收缩压/舒张压 (mmHg)</div>
                    <div style="display:flex;align-items:flex-end;height:150px;gap:10px;border-bottom:1px solid var(--card-border);">
                        ${data.map(d => `
                            <div style="flex:1;text-align:center;">
                                <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
                                    <div style="width:20px;height:${d.systolic*0.8}px;background:var(--primary);border-radius:4px 4px 0 0;"></div>
                                    <div style="width:20px;height:${d.diastolic*0.8}px;background:var(--primary-light);border-radius:4px 4px 0 0;"></div>
                                </div>
                                <div style="font-size:12px;color:var(--text-sub);margin-top:4px;">${d.date.slice(5)}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex;gap:20px;justify-content:center;margin-top:15px;">
                        <div style="display:flex;align-items:center;gap:6px;"><div style="width:12px;height:12px;background:var(--primary);"></div>收缩压</div>
                        <div style="display:flex;align-items:center;gap:6px;"><div style="width:12px;height:12px;background:var(--primary-light);"></div>舒张压</div>
                    </div>
                </div>
            `;
        },
        renderWeightChart(data) {
            const el = document.getElementById('weightChart');
            if (!data || !data.length) { this.renderWeightChartDefault(); return; }
            const min = Math.min(...data.map(d=>d.weight));
            const max = Math.max(...data.map(d=>d.weight));
            const range = max-min || 1;
            el.innerHTML = `
                <div style="padding:20px;">
                    <div style="display:flex;justify-content:space-between;margin-bottom:20px;">
                        <span style="color:var(--primary);font-weight:600;">体重 (kg)</span>
                        <span style="color:var(--text-sub);">${min.toFixed(1)} - ${max.toFixed(1)}</span>
                    </div>
                    <div style="position:relative;height:150px;border-bottom:1px solid var(--card-border);">
                        <svg width="100%" height="100%" viewBox="0 0 ${data.length*40} 150">
                            <polyline fill="none" stroke="var(--primary)" stroke-width="2"
                                points="${data.map((d,i)=>`${i*40+20},${150-((d.weight-min)/range*120+15)}`).join(' ')}" />
                            ${data.map((d,i)=>`<circle cx="${i*40+20}" cy="${150-((d.weight-min)/range*120+15)}" r="4" fill="var(--primary)"/>`).join('')}
                        </svg>
                    </div>
                </div>
            `;
        },
        renderBPChartDefault() {
            document.getElementById('bpChart').innerHTML = `<div style="padding:40px;text-align:center;">📊 暂无血压趋势数据</div>`;
        },
        renderWeightChartDefault() {
            document.getElementById('weightChart').innerHTML = `<div style="padding:40px;text-align:center;">📈 暂无体重趋势数据</div>`;
        },
        getToken() { return localStorage.getItem('token') || ''; }
    };

    // ============================================
    // 健康记录模块
    // ============================================
    const HealthRecordsModule = {
        async fetchHealthRecords() {
            try {
                const res = await fetch(`${API_BASE_URL}/health/records?limit=10`, {
                    headers: { 'Authorization': `Bearer ${this.getToken()}` }
                });
                if (res.ok) { this.renderRecords(await res.json()); } else { this.renderRecordsFromLocal(); }
            } catch { this.renderRecordsFromLocal(); }
        },
        renderRecordsFromLocal() {
            const records = JSON.parse(localStorage.getItem('healthRecords') || '{}');
            if (!records.bloodPressure) {
                this.renderRecords({
                    bloodPressure: [{date:'2024-03-20 08:30',value:'120/80 mmHg'},{date:'2024-03-19 08:15',value:'118/78 mmHg'}],
                    bloodSugar: [{date:'2024-03-20 07:00',value:'5.6 mmol/L'},{date:'2024-03-19 07:15',value:'5.8 mmol/L'}]
                });
            } else { this.renderRecords(records); }
        },
        renderRecords(data) {
            const container = document.getElementById('recordsGrid');
            const types = [
                {key:'bloodPressure',title:'血压记录',unit:'mmHg'},
                {key:'bloodSugar',title:'血糖记录',unit:'mmol/L'},
                {key:'weight',title:'体重记录',unit:'kg'},
                {key:'heartRate',title:'心率记录',unit:'次/分'}
            ];
            container.innerHTML = types.map(t => `
                <div class="record-card">
                    <div class="record-header">
                        <h3 class="record-title">${t.title}</h3>
                        <button class="add-btn" onclick="HealthRecordsModule.showAddModal('${t.key}')">+ 添加记录</button>
                    </div>
                    <ul class="record-list">
                        ${(data[t.key] || []).map(r => `
                            <li class="record-item">
                                <span class="record-date">${r.date}</span>
                                <span class="record-value">${r.value}</span>
                            </li>
                        `).join('') || '<li class="record-item" style="justify-content:center;">暂无记录</li>'}
                    </ul>
                </div>
            `).join('');
        },
        showAddModal(type) {
            const val = prompt(`请输入${{bloodPressure:'血压',bloodSugar:'血糖',weight:'体重',heartRate:'心率'}[type]}数值:`);
            val && this.addRecord(type, val);
        },
        async addRecord(type, val) {
            const rec = { date: new Date().toLocaleString('zh-CN'), value: val };
            const records = JSON.parse(localStorage.getItem('healthRecords') || '{}');
            (records[type] || (records[type] = [])).unshift(rec);
            localStorage.setItem('healthRecords', JSON.stringify(records));
            this.renderRecordsFromLocal();
        },
        getToken() { return localStorage.getItem('token') || ''; }
    };

    // ============================================
    // 页面初始化
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => navbar.classList.toggle('scrolled', window.scrollY > 50));
        initHealthPage();
    });

    async function initHealthPage() {
        await Promise.all([
            TodayHealthModule.fetchTodayHealthData(),
            AIAdviceModule.fetchAIAdvice(),
            HealthTrendModule.fetchBPTrend(),
            HealthTrendModule.fetchWeightTrend(),
            HealthRecordsModule.fetchHealthRecords()
        ]);
    }
</script>
</body>
</html>
