<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康资讯 - 草本数智</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #65746D;
            --primary-light: #7C8B85;
            --primary-bg: rgba(101, 116, 109, 0.035);
            --primary-border: rgba(101, 116, 109, 0.06);
            --ai-blue: #9AA7A3;
            --ai-blue-bg: rgba(154, 167, 163, 0.035);
            --anti-warm: #9C958C;
            --anti-warm-bg: rgba(156, 149, 140, 0.03);
            --bg-start: #FBF8F3;
            --bg-end: #F8F5F0;
            --card-bg: #FFFFFF;
            --card-border: rgba(200, 196, 190, 0.28);
            --text-title: #323834;
            --text-body: #55615C;
            --text-sub: #7B857F;
            --text-tip: #9FA8A4;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --space-xs: 8px;
            --space-sm: 14px;
            --space-md: 20px;
            --space-lg: 28px;
            --space-xl: 36px;
            --shadow: 0 8px 28px rgba(40, 44, 42, 0.03);
            --shadow-hover: 0 14px 42px rgba(40, 44, 42, 0.045);
            --transition: all 320ms cubic-bezier(0.34, 0, 0.12, 1);
            --bg-ink-opacity: 0.32;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: linear-gradient(170deg, var(--bg-start), var(--bg-end));
            background-attachment: fixed;
            color: var(--text-body);
            line-height: 1.7;
            overflow-x: hidden;
            padding-bottom: 100px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60px 180px at 4% 30%, rgba(85, 96, 90, 0.03) 0%, transparent 72%),
                radial-gradient(ellipse 40px 140px at 2% 60%, rgba(85, 96, 90, 0.02) 0%, transparent 72%),
                radial-gradient(ellipse 320px 120px at 18% 86%, rgba(80, 86, 86, 0.02) 0%, transparent 62%),
                radial-gradient(ellipse 260px 100px at 76% 92%, rgba(80, 86, 86, 0.018) 0%, transparent 62%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 28px;
            position: relative;
            z-index: 1;
        }

        /* 导航栏 */
        .nav-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: rgba(255, 253, 248, 0.85);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border-bottom: 1px solid var(--card-border);
            box-shadow: 0 2px 12px rgba(74, 82, 80, 0.03);
            transition: var(--transition);
        }

        .nav-wrapper.scrolled {
            background: rgba(255, 253, 248, 0.94);
            box-shadow: 0 4px 20px rgba(74, 82, 80, 0.05);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 84px;
            transition: var(--transition);
        }

        .nav-wrapper.scrolled .nav-container { height: 70px; }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary);
            font-weight: 700;
            font-size: 21px;
            text-decoration: none;
            transition: var(--transition);
        }

        .nav-logo:hover { opacity: 0.88; }
        .nav-logo svg { width: 38px; height: 38px; }

        .nav-menu {
            display: flex;
            gap: 6px;
            list-style: none;
        }

        .nav-menu li a {
            text-decoration: none;
            color: var(--text-body);
            font-weight: 500;
            font-size: 15px;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            position: relative;
            letter-spacing: 0.01em;
        }

        .nav-menu li a:hover {
            color: var(--primary);
            background: var(--primary-bg);
        }

        .nav-menu li a.active {
            color: var(--primary);
            background: var(--primary-bg);
        }

        .nav-menu li a.active::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 2.5px;
            background: var(--primary);
            border-radius: 2px;
        }

        .main-content {
            margin-top: 110px;
            padding-bottom: 60px;
        }

        .page-header {
            text-align: center;
            margin-bottom: var(--space-xl);
            padding: var(--space-xl) 0;
            background: var(--primary-bg);
            border-radius: var(--radius-xl);
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-title);
            margin-bottom: var(--space-sm);
        }

        .page-subtitle {
            font-size: 16px;
            color: var(--text-sub);
        }

        .section {
            margin-bottom: var(--space-xl);
            padding: var(--space-xl);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .section:hover { box-shadow: var(--shadow-hover); }

        /* 分类标签 */
        .category-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: var(--space-lg);
            flex-wrap: wrap;
            justify-content: center;
        }

        .category-tab {
            padding: 10px 22px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 99px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-body);
            cursor: pointer;
            transition: var(--transition);
        }

        .category-tab:hover,
        .category-tab.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* 文章网格 */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-lg);
        }

        .news-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
        }

        .news-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .news-image {
            width: 100%;
            height: 180px;
            background: var(--primary-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: var(--primary);
        }

        .news-content {
            padding: var(--space-md);
        }

        .news-category {
            display: inline-block;
            padding: 4px 12px;
            background: var(--primary-bg);
            color: var(--primary);
            font-size: 13px;
            border-radius: 99px;
            margin-bottom: var(--space-sm);
        }

        .news-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-title);
            margin-bottom: var(--space-sm);
            line-height: 1.5;
        }

        .news-summary {
            font-size: 15px;
            color: var(--text-body);
            line-height: 1.7;
            margin-bottom: var(--space-md);
        }

        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
        }

        /* 推荐文章 */
        .featured-news {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-lg);
            margin-bottom: var(--space-xl);
        }

        .featured-main {
            grid-row: span 2;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .featured-main .news-image {
            height: 300px;
        }

        .featured-main .news-content {
            padding: var(--space-lg);
        }

        .featured-main .news-title {
            font-size: 22px;
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: var(--space-xl);
        }

        .page-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-body);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .page-btn:hover,
        .page-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* 加载 & 空状态 */
        .loading-container {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 46px;
            height: 46px;
            border: 3px solid var(--card-border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-sub);
        }

        .empty-icon {
            font-size: 52px;
            margin-bottom: 16px;
        }

        /* 文章详情弹窗 */
        .article-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            position: relative;
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: var(--shadow-hover);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            border: none;
            background: var(--card-bg);
            border-radius: 50%;
            font-size: 22px;
            color: var(--text-sub);
            cursor: pointer;
            z-index: 10;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--primary);
            color: #fff;
        }

        .modal-body {
            max-height: 90vh;
            overflow-y: auto;
            padding: 0;
        }

        .article-header {
            padding: var(--space-xl);
            background: var(--primary-bg);
        }

        .article-category {
            display: inline-block;
            padding: 5px 14px;
            background: var(--primary);
            color: #fff;
            font-size: 13px;
            border-radius: 99px;
            margin-bottom: 14px;
        }

        .article-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-title);
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .article-meta {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: var(--text-sub);
        }

        .article-content {
            padding: var(--space-xl);
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-body);
        }

        .article-content h2 {
            font-size: 22px;
            color: var(--primary);
            margin: 28px 0 14px;
        }

        .article-content h3 {
            font-size: 19px;
            color: var(--text-title);
            margin: 22px 0 12px;
        }

        .article-content p {
            margin-bottom: 14px;
        }

        .article-content ul,
        .article-content ol {
            margin: 14px 0;
            padding-left: 24px;
        }

        .article-content li {
            margin-bottom: 8px;
        }

        .article-content blockquote {
            border-left: 3px solid var(--primary);
            padding-left: 16px;
            margin: 20px 0;
            color: var(--text-sub);
            font-style: normal;
        }

        /* 管理员表单 */
        .form-group {
            margin-bottom: var(--space-md);
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-body);
            margin-bottom: 6px;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: inherit;
            background: #fff;
            transition: var(--transition);
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-md);
        }

        .btn-primary, .btn-secondary {
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
        }

        .btn-primary:hover {
            background: var(--primary-light);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary-bg);
        }

        /* 管理按钮 */
        .admin-floating-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: var(--shadow);
            z-index: 1000;
            transition: var(--transition);
        }

        .admin-floating-btn:hover {
            transform: scale(1.08);
            box-shadow: var(--shadow-hover);
        }

        .card-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: none;
            gap: 6px;
        }

        .news-card:hover .card-actions {
            display: flex;
        }

        .card-action-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            cursor: pointer;
            color: #fff;
        }

        .card-action-btn.edit { background: #5896D9; }
        .card-action-btn.delete { background: #F26A6A; }

        /* 底部 */
        .footer {
            background: var(--primary-bg);
            padding: var(--space-xl) 20px;
            text-align: center;
            margin-top: var(--space-xl);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 14px;
        }

        .footer-links a:hover {
            color: var(--primary);
        }

        .footer-copyright {
            color: var(--text-tip);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .nav-menu { display: none; }
            .news-grid { grid-template-columns: 1fr; }
            .featured-news { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .section { padding: var(--space-md); }
            .article-header, .article-content { padding: var(--space-md); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 163, 154, 0.18); border-radius: 3px; }
    </style>
</head>

<main class="main-content">
    <div class="page-header">
        <div class="container">
            <h1 class="page-title">健康资讯</h1>
            <p class="page-subtitle">权威养生资讯，守护您的健康</p>
        </div>
    </div>

    <div class="container">
        <section class="section">
            <div class="category-tabs" id="categoryTabs">
                <button class="category-tab active" data-category="all">全部资讯</button>
                <button class="category-tab" data-category="solar-term">节气养生</button>
                <button class="category-tab" data-category="chronic">慢病管理</button>

<!-- 文章详情弹窗 -->
<div class="article-modal" id="articleModal" style="display: none;">
    <div class="modal-overlay" onclick="NewsModule.closeArticle()"></div>
    <div class="modal-content">
        <button class="modal-close" onclick="NewsModule.closeArticle()">×</button>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<!-- 管理员弹窗 -->
<div class="article-modal" id="adminModal" style="display: none;">
    <div class="modal-overlay" onclick="NewsAdminModule.closeAdminModal()"></div>
    <div class="modal-content admin-modal-content">
        <button class="modal-close" onclick="NewsAdminModule.closeAdminModal()">×</button>
        <div class="modal-body">
            <div class="admin-header" style="padding:24px;background:var(--primary-bg);">
                <h2 id="adminModalTitle">发布新文章</h2>
            </div>
            <form id="articleForm" class="admin-form" style="padding:24px;">
                <input type="hidden" id="editArticleId" value="">

                <div class="form-group">
                    <label class="form-label">文章标题</label>
                    <input type="text" id="articleTitle" class="form-input" placeholder="请输入文章标题" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">文章分类</label>
                        <select id="articleCategory" class="form-input" required>
                            <option value="">请选择分类</option>
                            <option value="solar-term">节气养生</option>
                            <option value="chronic">慢病管理</option>
                            <option value="diet">食疗保健</option>
                            <option value="exercise">运动养生</option>
                            <option value="anti-fraud">防骗科普</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">文章图标</label>
                        <select id="articleIcon" class="form-input">
                            <option value="">默认</option>
                            <option value="🌿">🌿 植物</option>
                            <option value="💊">💊 药物</option>
                            <option value="🥗">🥗 食物</option>
                            <option value="🏃">🏃 运动</option>
                            <option value="⚠️">⚠️ 警告</option>
                            <option value="🧘">🧘 冥想</option>
                            <option value="💆">💆 按摩</option>
                            <option value="📚">📚 知识</option>
                            <option value="❤️">❤️ 健康</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">作者</label>
                        <input type="text" id="articleAuthor" class="form-input" placeholder="请输入作者名">
                    </div>
                    <div class="form-group" style="display:flex;align-items:center;gap:8px;margin-top:24px;">
                        <input type="checkbox" id="articleFeatured">
                        <label>设为推荐文章</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">文章摘要</label>
                    <textarea id="articleSummary" class="form-textarea" rows="3" placeholder="请输入文章摘要" required></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">文章内容</label>
                    <div class="editor-toolbar" style="margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;">
                        <button type="button" onclick="NewsAdminModule.insertTag('h2')" style="padding:6px 12px;border:1px solid var(--card-border);border-radius:6px;background:#fff;">标题</button>
                        <button type="button" onclick="NewsAdminModule.insertTag('h3')" style="padding:6px 12px;border:1px solid var(--card-border);border-radius:6px;background:#fff;">小标题</button>
                        <button type="button" onclick="NewsAdminModule.insertTag('p')" style="padding:6px 12px;border:1px solid var(--card-border);border-radius:6px;background:#fff;">段落</button>
                        <button type="button" onclick="NewsAdminModule.insertTag('strong')" style="padding:6px 12px;border:1px solid var(--card-border);border-radius:6px;background:#fff;">加粗</button>
                        <button type="button" onclick="NewsAdminModule.insertTag('ul')" style="padding:6px 12px;border:1px solid var(--card-border);border-radius:6px;background:#fff;">列表</button>
                        <button type="button" onclick="NewsAdminModule.insertTag('blockquote')" style="padding:6px 12px;border:1px solid var(--card-border);border-radius:6px;background:#fff;">引用</button>
                    </div>
                    <textarea id="articleContent" class="form-textarea content-editor" rows="12" placeholder="请输入文章内容" required></textarea>
                </div>

                <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:24px;">
                    <button type="button" class="btn-secondary" onclick="NewsAdminModule.closeAdminModal()">取消</button>
                    <button type="submit" class="btn-primary" id="submitBtn">发布文章</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 管理员悬浮按钮 -->
<div class="admin-floating-btn" id="adminBtn" onclick="NewsAdminModule.openAdminModal()" title="文章管理" style="display: none;">
    <span>⚙️</span>
</div>

<footer class="footer">
    <div class="footer-content">
        <div class="footer-links">
            <a href="about.html">关于我们</a>
            <a href="#">联系方式</a>
            <a href="#">隐私政策</a>
            <a href="#">版权声明</a>
        </div>
        <p class="footer-copyright">© 2024 草本数智 版权所有</p>
    </div>
</footer>

<script>
    // ====================== 原有JS逻辑完全保留 ======================
    const API_BASE_URL = 'http://localhost:8080/api';
    const CATEGORY_MAP = {
        'all': '全部资讯',
        'solar-term': '节气养生',
        'chronic': '慢病管理',
        'diet': '食疗保健',
        'exercise': '运动养生',
        'anti-fraud': '防骗科普'
    };
    const CATEGORY_ICONS = {
        'solar-term': '🌿',
        'chronic': '💊',
        'diet': '🥗',
        'exercise': '🏃',
        'anti-fraud': '⚠️',
        'default': '📰'
    };

    const NewsModule = {
        currentCategory: 'all',
        currentPage: 1,
        pageSize: 6,
        totalPages: 1,
        articles: [],

        init() {
            this.bindEvents();
            this.loadArticles();
        },

        bindEvents() {
            const navbar = document.getElementById('navbar');
            window.addEventListener('scroll', () => {
                navbar.classList.toggle('scrolled', window.scrollY > 50);
            });

            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    this.switchCategory(e.target.dataset.category);
                });
            });
        },

        switchCategory(category) {
            this.currentCategory = category;
            this.currentPage = 1;
            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-category="${category}"]`).classList.add('active');
            this.loadArticles();
        },

        async loadArticles() {
            this.showLoading(true);
            try {
                const params = new URLSearchParams({
                    page: this.currentPage,
                    size: this.pageSize,
                    category: this.currentCategory === 'all' ? '' : this.currentCategory
                });
                const response = await fetch(`${API_BASE_URL}/articles?${params}`, {
                    headers: { 'Authorization': `Bearer ${this.getToken()}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    this.articles = data.articles || [];
                    this.totalPages = data.totalPages || 1;
                    this.renderArticles();
                } else {
                    this.loadMockArticles();
                }
            } catch (error) {
                this.loadMockArticles();
            }
            this.showLoading(false);
        },

        loadMockArticles() {
            const mockArticles = [
                {id:1,title:'春分养生指南：阴阳平衡，调理身心',summary:'春分时节，昼夜平分，阴阳平衡。此时养生应顺应自然规律，注重调和阴阳，保持身心平衡。',category:'solar-term',author:'张医师',publishDate:'2024-03-20',views:1250,isFeatured:true,icon:'🌿'},
                {id:2,title:'高血压患者春季调理方案',summary:'春季气温变化大，高血压患者需特别注意血压管理。本文为您介绍春季高血压的中医调理方法。',category:'chronic',author:'李医师',publishDate:'2024-03-18',views:980,isFeatured:true,icon:'💊'},
                {id:3,title:'春季养肝食谱推荐',summary:'春季养肝正当时，这些食材帮您护肝明目。推荐5道简单易做的养肝食谱。',category:'diet',author:'王营养师',publishDate:'2024-03-15',views:1560,isFeatured:true,icon:'🥗'},
                {id:4,title:'适合中老年人的春季运动指南',summary:'春季是运动的好时节，但中老年人在运动时需要特别注意运动强度和方式。',category:'exercise',author:'陈教练',publishDate:'2024-03-12',views:890,isFeatured:false,icon:'🏃'},
                {id:5,title:'警惕！这些养生谣言您中招了吗？',summary:'网络上充斥着各种养生谣言，很多中老年人容易上当受骗。',category:'anti-fraud',author:'刘专家',publishDate:'2024-03-10',views:2100,isFeatured:false,icon:'⚠️'},
                {id:6,title:'惊蛰养生：春雷响，万物长',summary:'惊蛰时节，春雷始鸣，万物复苏。此时人体阳气生发，养生应顺应春气。',category:'solar-term',author:'张医师',publishDate:'2024-03-05',views:1120,isFeatured:false,icon:'🧘'},
                {id:7,title:'糖尿病患者的中医调理方法',summary:'中医在糖尿病调理方面有着独特的优势，通过饮食调理、穴位按摩等方法。',category:'chronic',author:'李医师',publishDate:'2024-03-01',views:1350,isFeatured:false,icon:'💆'}
            ];
            this.articles = this.currentCategory === 'all' ? mockArticles : mockArticles.filter(a => a.category === this.currentCategory);
            this.totalPages = Math.ceil(this.articles.length / this.pageSize);
            this.renderArticles();
        },

        renderArticles() {
            const featuredContainer = document.getElementById('featuredNews');
            const newsGrid = document.getElementById('newsGrid');
            const emptyState = document.getElementById('emptyState');
            featuredContainer.innerHTML = '';
            newsGrid.innerHTML = '';

            if (this.articles.length === 0) {
                emptyState.style.display = 'block';
                this.renderPagination();
                return;
            }
            emptyState.style.display = 'none';

            const featuredArticles = this.articles.filter(a => a.isFeatured);
            const normalArticles = this.articles.filter(a => !a.isFeatured);

            if (this.currentPage === 1 && this.currentCategory === 'all' && featuredArticles.length > 0) {
                this.renderFeaturedArticles(featuredArticles.slice(0, 3));
            }

            const start = (this.currentPage - 1) * this.pageSize;
            const pageArticles = normalArticles.slice(start, start + this.pageSize);
            pageArticles.forEach(article => newsGrid.appendChild(this.createArticleCard(article)));
            this.renderPagination();
        },

        renderFeaturedArticles(articles) {
            const container = document.getElementById('featuredNews');
            const main = articles[0];
            const sides = articles.slice(1);
            let html = `
                <div class="featured-main" onclick="NewsModule.openArticle(${main.id})">
                    <div class="news-image">${main.icon || CATEGORY_ICONS[main.category]}</div>
                    <div class="news-content">
                        <span class="news-category">${CATEGORY_MAP[main.category]}</span>
                        <h3 class="news-title">${main.title}</h3>
                        <p class="news-summary">${main.summary}</p>
                        <div class="news-meta">
                            <span>${main.publishDate}</span>
                            <span>👁 ${main.views} 阅读</span>
                        </div>
                    </div>
                </div>
            `;
            sides.forEach(a => {
                html += `
                    <div class="news-card" onclick="NewsModule.openArticle(${a.id})">
                        <div class="news-image">${a.icon || CATEGORY_ICONS[a.category]}</div>
                        <div class="news-content">
                            <span class="news-category">${CATEGORY_MAP[a.category]}</span>
                            <h3 class="news-title">${a.title}</h3>
                            <p class="news-summary">${a.summary}</p>
                            <div class="news-meta">
                                <span>${a.publishDate}</span>
                                <span>👁 ${a.views} 阅读</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        },

        createArticleCard(article) {
            const card = document.createElement('div');
            card.className = 'news-card';
            card.dataset.articleId = article.id;
            card.onclick = e => e.target.closest('.card-actions') || this.openArticle(article.id);
            const isAdmin = NewsAdminModule.isAdmin();
            card.innerHTML = `
                <div class="news-image">${article.icon || CATEGORY_ICONS[article.category]}</div>
                <div class="news-content">
                    <span class="news-category">${CATEGORY_MAP[article.category]}</span>
                    <h3 class="news-title">${article.title}</h3>
                    <p class="news-summary">${article.summary}</p>
                    <div class="news-meta">
                        <span>${article.publishDate}</span>
                        <span>👁 ${article.views} 阅读</span>
                    </div>
                </div>
                ${isAdmin ? `
                <div class="card-actions">
                    <button class="card-action-btn edit" onclick="NewsAdminModule.editArticle(${article.id})">✏️</button>
                    <button class="card-action-btn delete" onclick="NewsAdminModule.deleteArticle(${article.id})">🗑️</button>
                </div>
                ` : ''}
            `;
            return card;
        },

        renderPagination() {
            const container = document.getElementById('pagination');
            if (this.totalPages <= 1) { container.innerHTML = ''; return; }
            let html = `<button class="page-btn" onclick="NewsModule.goToPage(${this.currentPage-1})" ${this.currentPage===1?'disabled':''}>←</button>`;
            for(let i=1;i<=this.totalPages;i++){
                if(i===1||i===this.totalPages||(i>=this.currentPage-1&&i<=this.currentPage+1)){
                    html+=`<button class="page-btn ${i===this.currentPage?'active':''}" onclick="NewsModule.goToPage(${i})">${i}</button>`;
                }else if(i===this.currentPage-2||i===this.currentPage+2){
                    html+=`<span class="page-btn" style="border:none;">...</span>`;
                }
            }
            html+=`<button class="page-btn" onclick="NewsModule.goToPage(${this.currentPage+1})" ${this.currentPage===this.totalPages?'disabled':''}>→</button>`;
            container.innerHTML = html;
        },

        goToPage(page) {
            if (page < 1 || page > this.totalPages) return;
            this.currentPage = page;
            this.loadArticles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        async openArticle(id) {
            const modal = document.getElementById('articleModal');
            const body = document.getElementById('modalBody');
            body.innerHTML = `<div style="text-align:center;padding:60px;"><div class="loading-spinner"></div><p>加载中...</p></div>`;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            try {
                const res = await fetch(`${API_BASE_URL}/articles/${id}`,{headers:{'Authorization':`Bearer ${this.getToken()}`}});
                const article = res.ok ? await res.json() : this.articles.find(a=>a.id===id);
                this.renderArticleDetail({...article,content:article.content||this.generateMockContent(article)});
            }catch(e){
                const a = this.articles.find(x=>x.id===id);
                this.renderArticleDetail({...a,content:this.generateMockContent(a)});
            }
        },

        renderArticleDetail(a) {
            document.getElementById('modalBody').innerHTML = `
                <div class="article-header">
                    <span class="article-category">${CATEGORY_MAP[a.category]}</span>
                    <h1 class="article-title">${a.title}</h1>
                    <div class="article-meta">
                        <span>👤 ${a.author||'匿名'}</span>
                        <span>📅 ${a.publishDate}</span>
                        <span>👁 ${a.views||0}</span>
                    </div>
                </div>
                <div class="article-content">${a.content}</div>
            `;
        },

        generateMockContent(a) {
            return `
                <p>${a.summary}</p>
                <h2>一、养生要点</h2>
                <p>顺应自然、饮食清淡、作息规律、适度运动、心情舒畅，是中医养生的核心。</p>
                <h2>二、实用建议</h2>
                <ul><li>早睡早起</li><li>饮食均衡</li><li>适度锻炼</li><li>定期体检</li></ul>
                <blockquote>养生贵在坚持，祝您身体健康</blockquote>
            `;
        },

        closeArticle() {
            document.getElementById('articleModal').style.display = 'none';
            document.body.style.overflow = '';
        },

        showLoading(show) {
            const l = document.getElementById('loadingContainer');
            const f = document.getElementById('featuredNews');
            const g = document.getElementById('newsGrid');
            l.style.display = show ? 'block' : 'none';
            f.style.display = show ? 'none' : '';
            g.style.display = show ? 'none' : '';
        },

        getToken() { return localStorage.getItem('token')||''; }
    };

    const NewsAdminModule = {
        isEditMode: false, editingId: null,
        isAdmin() { const r=localStorage.getItem('userRole'); return r==='admin'||r==='editor'; },
        init() { if(this.isAdmin()) document.getElementById('adminBtn').style.display='flex';
            document.getElementById('articleForm').addEventListener('submit',e=>{e.preventDefault();this.saveArticle();});
        },
        openAdminModal() {
            this.isEditMode=false; document.getElementById('adminModalTitle').textContent='发布新文章';
            document.getElementById('submitBtn').textContent='发布文章';
            document.getElementById('articleForm').reset();
            document.getElementById('adminModal').style.display='flex';
            document.body.style.overflow='hidden';
        },
        closeAdminModal() { document.getElementById('adminModal').style.display='none'; document.body.style.overflow=''; },
        async editArticle(id) {
            this.isEditMode=true; this.editingId=id;
            document.getElementById('adminModalTitle').textContent='编辑文章';
            document.getElementById('submitBtn').textContent='保存修改';
            const a=NewsModule.articles.find(x=>x.id===id);
            document.getElementById('editArticleId').value=a.id;
            document.getElementById('articleTitle').value=a.title;
            document.getElementById('articleCategory').value=a.category;
            document.getElementById('articleIcon').value=a.icon||'';
            document.getElementById('articleAuthor').value=a.author||'';
            document.getElementById('articleFeatured').checked=a.isFeatured||false;
            document.getElementById('articleSummary').value=a.summary;
            try{const res=await fetch(`${API_BASE_URL}/articles/${id}`,{headers:{'Authorization':`Bearer ${NewsModule.getToken()}`}});
                const full=res.ok?await res.json():a;
                document.getElementById('articleContent').value=full.content||a.summary;
            }catch(e){document.getElementById('articleContent').value=a.summary;}
            document.getElementById('adminModal').style.display='flex';
            document.body.style.overflow='hidden';
        },
        async saveArticle() {
            const data={
                title:document.getElementById('articleTitle').value,
                category:document.getElementById('articleCategory').value,
                icon:document.getElementById('articleIcon').value,
                author:document.getElementById('articleAuthor').value,
                isFeatured:document.getElementById('articleFeatured').checked,
                summary:document.getElementById('articleSummary').value,
                content:document.getElementById('articleContent').value,
                publishDate:new Date().toISOString().split('T')[0]
            };
            try{
                let res;
                if(this.isEditMode){
                    res=await fetch(`${API_BASE_URL}/articles/${this.editingId}`,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':`Bearer ${NewsModule.getToken()}`},body:JSON.stringify(data)});
                }else{
                    res=await fetch(`${API_BASE_URL}/articles`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${NewsModule.getToken()}`},body:JSON.stringify(data)});
                }
                if(res.ok){alert(this.isEditMode?'更新成功':'发布成功');this.closeAdminModal();NewsModule.loadArticles();}
                else{this.mockSave(data);}
            }catch(e){this.mockSave(data);}
        },
        mockSave(data){
            if(this.isEditMode){
                const i=NewsModule.articles.findIndex(x=>x.id===this.editingId);
                NewsModule.articles[i]={...NewsModule.articles[i],...data};
                alert('更新成功（本地）');
            }else{
                NewsModule.articles.unshift({id:Date.now(),...data,views:0});
                alert('发布成功（本地）');
            }
            this.closeAdminModal();NewsModule.renderArticles();
        },
        async deleteArticle(id){
            if(!confirm('确定删除？'))return;
            try{await fetch(`${API_BASE_URL}/articles/${id}`,{method:'DELETE',headers:{'Authorization':`Bearer ${NewsModule.getToken()}`}});
                alert('删除成功');NewsModule.loadArticles();
            }catch(e){
                NewsModule.articles=NewsModule.articles.filter(x=>x.id!==id);
                NewsModule.renderArticles();alert('删除成功（本地）');
            }
        },
        insertTag(t){
            const ta=document.getElementById('articleContent');
            const s=ta.selectionStart,e=ta.selectionEnd;
            const txt=ta.value.substring(s,e);
            let ins='';
            if(t==='h2')ins=`<h2>${txt||'标题'}</h2>`;
            else if(t==='h3')ins=`<h3>${txt||'小标题'}</h3>`;
            else if(t==='p')ins=`<p>${txt||'内容'}</p>`;
            else if(t==='strong')ins=`<strong>${txt||'加粗'}</strong>`;
            else if(t==='ul')ins=`<ul><li>${txt||'项1'}</li><li>项2</li></ul>`;
            else if(t==='blockquote')ins=`<blockquote>${txt||'引用'}</blockquote>`;
            ta.value=ta.value.substring(0,s)+ins+ta.value.substring(e);
            ta.focus();
        }
    };

    document.addEventListener('DOMContentLoaded',()=>{NewsModule.init();NewsAdminModule.init();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){NewsModule.closeArticle();NewsAdminModule.closeAdminModal();}});
</script>
</body>
