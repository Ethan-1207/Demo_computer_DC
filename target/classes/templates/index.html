<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>草本数智 - 银发经济健康平台</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary:#2D5B4D;
            --primary-light:#4A7C6B;
            --bg-start:#FAF7F2;
            --bg-end:#F3EFE7;
            --card-bg:#fff;
            --text-title:#262E2A;
            --text-body:#48544F;
            --text-sub:#7A8881;
            --radius-lg:22px;
            --shadow:0 10px 30px rgba(0,0,0,0.05);
            --transition:all .3s ease;
        }

        /* ===== 背景 ===== */
        body{
            font-family:'Noto Sans SC','Inter';
            background:linear-gradient(170deg,var(--bg-start),var(--bg-end));
            margin:0;
        }

        /* ===== 竹子升级版（关键优化） ===== */
        .bamboo{
            position:fixed;
            top:0;
            bottom:0;
            width:180px;
            background-size:contain;
            background-repeat:no-repeat;
            opacity:.08;
            z-index:0;
            pointer-events:none;
        }

        .bamboo.left{
            left:0;
            background-image:url("https://p.qqan.com/up/2021-7/16256256138669506.png");
            background-position:left top;
            mask-image:linear-gradient(to right, black 40%, transparent);
        }

        .bamboo.right{
            right:0;
            background-image:url("https://p.qqan.com/up/2021-7/16256256138669506.png");
            background-position:right top;
            transform:scaleX(-1);
            mask-image:linear-gradient(to left, black 40%, transparent);
        }

        /* ===== 主体 ===== */
        .container{
            max-width:1100px;
            margin:auto;
            padding:120px 20px;
            position:relative;
            z-index:1;
        }

        /* ===== 卡片 ===== */
        .section{
            background:var(--card-bg);
            border-radius:30px;
            padding:30px;
            box-shadow:var(--shadow);
            margin-bottom:30px;
        }

        /* ===== 推送卡片 ===== */
        .push-card{
            background:#fff;
            border-radius:var(--radius-lg);
            padding:20px;
            margin-bottom:15px;
            position:relative;
            transition:var(--transition);
        }

        .push-card:hover{
            transform:translateY(-5px);
        }

        .push-card:active{
            transform:scale(.97);
        }

        /* ⭐ 主卡 */
        .push-card.featured{
            background:linear-gradient(135deg,#fff,#f3f8f6);
            border:1px solid rgba(45,91,77,.2);
        }

        .push-card-title{
            font-size:18px;
            font-weight:600;
            color:var(--text-title);
        }

        .push-card-content{
            font-size:14px;
            color:var(--text-body);
            margin-top:8px;
        }

        /* 时间右上角 */
        .push-time{
            position:absolute;
            right:20px;
            top:20px;
            font-size:12px;
            color:var(--text-sub);
        }

        /* ===== 骨架屏 ===== */
        .loading{
            height:100px;
            border-radius:var(--radius-lg);
            background:linear-gradient(90deg,#eee,#f5f5f5,#eee);
            animation:loading 1.2s infinite;
        }

        @keyframes loading{
            0%{background-position:-200px}
            100%{background-position:200px}
        }

        /* ===== 按钮 ===== */
        button{
            padding:10px 18px;
            border:none;
            border-radius:10px;
            background:var(--primary);
            color:#fff;
            cursor:pointer;
            transition:var(--transition);
        }

        button:hover{transform:translateY(-2px);}
        button:active{transform:scale(.95);}

    </style>
</head>

<body>

<!-- 竹子 -->
<div class="bamboo left"></div>
<div class="bamboo right"></div>

<div class="container">

    <div class="section">
        <h2>今日养生推送</h2>

        <div id="list">
            <div class="loading"></div>
        </div>
    </div>

</div>

<script>

    /* ===== 模拟数据 ===== */
    const data=[
        {title:"节气养生提醒",content:"今日宜养肝",time:"10:30",featured:true},
        {title:"AI每日养生课",content:"春季护肝",time:"10:31"},
        {title:"防骗提醒",content:"警惕保健品骗局",time:"10:32"}
    ]

    const list=document.getElementById("list")

    setTimeout(()=>{
        list.innerHTML=data.map(item=>`
            <div class="push-card ${item.featured?'featured':''}">
                <div class="push-time">${item.time}</div>
                <div class="push-card-title">${item.title}</div>
                <div class="push-card-content">${item.content}</div>
            </div>
        `).join("")
    },800)

</script>

</body>
</html>
